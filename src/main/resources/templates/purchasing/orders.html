<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    Purchase Order - LankaTex
  </title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- Common LankaTex Navigation CSS -->
  <link rel="stylesheet"
        th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container py-4">


  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">

    <h2>
      Purchase Order Management
    </h2>

    <a class="btn btn-dark btn-sm"
       th:href="@{/purchasing}">
      Dashboard
    </a>

  </div>


  <!-- Purchasing Module Navigation -->
  <div class="mb-3">

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/purchasing/suppliers}">
      Supplier
    </a>

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/purchasing/requests}">
      Purchase Request
    </a>

    <a class="btn btn-primary btn-sm me-2 mb-2"
       th:href="@{/purchasing/orders}">
      Purchase Order
    </a>

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/purchasing/items}">
      Purchase Order Item
    </a>

  </div>


  <!-- Success Message -->
  <div th:if="${message}"
       class="alert alert-success"
       th:text="${message}">
  </div>


  <!-- Error Message -->
  <div th:if="${error}"
       class="alert alert-danger"
       th:text="${error}">
  </div>


  <!-- Purchase Order Form -->
  <div class="card shadow-sm mb-4">

    <div class="card-header">

      <strong>
        Add / Edit Purchase Order
      </strong>

    </div>


    <div class="card-body">

      <form th:action="@{/purchasing/orders/save}"
            th:object="${purchaseOrder}"
            method="post">


        <input type="hidden"
               th:field="*{poId}">


        <div class="row">


          <!-- Supplier ID -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Supplier ID
            </label>

            <input class="form-control"
                   type="number"
                   th:field="*{supplierId}"
                   required>

          </div>


          <!-- Request ID -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Request ID
            </label>

            <input class="form-control"
                   type="number"
                   th:field="*{requestId}">

          </div>


          <!-- Order Date -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Order Date
            </label>

            <input class="form-control"
                   type="date"
                   th:field="*{orderDate}"
                   required>

          </div>


          <!-- Expected Delivery Date -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Expected Delivery Date
            </label>

            <input class="form-control"
                   type="date"
                   th:field="*{expectedDeliveryDate}"
                   required>

          </div>


          <!-- Status -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Status
            </label>

            <input class="form-control"
                   type="text"
                   th:field="*{status}">

          </div>


          <!-- Total Amount -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Total Amount
            </label>

            <input class="form-control"
                   type="number"
                   step="0.01"
                   th:field="*{totalAmount}"
                   required>

          </div>


          <!-- Approved By -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Approved By User ID
            </label>

            <input class="form-control"
                   type="number"
                   th:field="*{approvedBy}">

          </div>


        </div>


        <button class="btn btn-success"
                type="submit">
          Save
        </button>


        <a class="btn btn-secondary"
           th:href="@{/purchasing/orders}">
          Clear
        </a>


      </form>

    </div>

  </div>


  <!-- Purchase Order List -->
  <div class="card shadow-sm">

    <div class="card-header">

      <strong>
        Purchase Order List
      </strong>

    </div>


    <div class="card-body table-responsive">

      <table class="table table-striped table-bordered align-middle">

        <thead class="table-dark">

        <tr>

          <th>ID</th>
          <th>Supplier ID</th>
          <th>Request ID</th>
          <th>Order Date</th>
          <th>Expected Delivery</th>
          <th>Status</th>
          <th>Total Amount</th>
          <th>Approved By</th>
          <th>Actions</th>

        </tr>

        </thead>


        <tbody>


        <tr th:each="row : ${ordersList}">


          <td th:text="${row.poId}">
          </td>


          <td th:text="${row.supplierId}">
          </td>


          <td th:text="${row.requestId}">
          </td>


          <td th:text="${row.orderDate}">
          </td>


          <td th:text="${row.expectedDeliveryDate}">
          </td>


          <!-- Status -->
          <td>

                        <span th:if="${row.status == 'Archived'}"
                              class="badge bg-secondary">
                            Archived
                        </span>

            <span th:unless="${row.status == 'Archived'}"
                  class="badge bg-success"
                  th:text="${row.status}">
                        </span>

          </td>


          <td th:text="${row.totalAmount}">
          </td>


          <td th:text="${row.approvedBy}">
          </td>


          <!-- Actions -->
          <td class="text-nowrap">


            <!-- Edit -->
            <a class="btn btn-warning btn-sm"
               th:href="@{/purchasing/orders(editId=${row.poId})}">
              Edit
            </a>


            <!-- Archive -->
            <form th:if="${row.status != 'Archived'}"
                  method="post"
                  class="d-inline"
                  th:action="@{/purchasing/orders/archive/{id}(id=${row.poId})}">

              <button type="submit"
                      class="btn btn-secondary btn-sm"
                      onclick="return confirm('Archive this Purchase Order?');">
                Archive
              </button>

            </form>


            <!-- Restore -->
            <form th:if="${row.status == 'Archived'}"
                  method="post"
                  class="d-inline"
                  th:action="@{/purchasing/orders/restore/{id}(id=${row.poId})}">

              <button type="submit"
                      class="btn btn-success btn-sm"
                      onclick="return confirm('Restore this Purchase Order to Pending status?');">
                Restore
              </button>

            </form>


            <!-- Delete -->
            <form method="post"
                  class="d-inline"
                  th:action="@{/purchasing/orders/delete/{id}(id=${row.poId})}">

              <button type="submit"
                      class="btn btn-danger btn-sm"
                      onclick="return confirm('WARNING: Permanently delete this Purchase Order?');">
                Delete
              </button>

            </form>


          </td>

        </tr>


        </tbody>

      </table>

    </div>

  </div>


</div>


</body>

</html>
