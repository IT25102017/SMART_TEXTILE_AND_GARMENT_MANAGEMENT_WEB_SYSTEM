<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supplier and Purchase Order Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Supplier and Purchase Order Management</h2>
        <a class="btn btn-dark btn-sm" th:href="@{/purchasing}">Dashboard</a>
    </div>
    <div class="mb-3">
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/purchasing/suppliers}">Supplier</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/purchasing/requests}">Purchase Request</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/purchasing/orders}">Purchase Order</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/purchasing/items}">Purchase Order Item</a>
    </div>
    <div class="row">
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Supplier</h6>
                <h2 th:text="${stats.supplierCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/purchasing/suppliers}">Open</a>
            </div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Purchase Request</h6>
                <h2 th:text="${stats.purchaseRequestCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/purchasing/requests}">Open</a>
            </div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Purchase Order</h6>
                <h2 th:text="${stats.purchaseOrderCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/purchasing/orders}">Open</a>
            </div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Purchase Order Item</h6>
                <h2 th:text="${stats.purchaseOrderItemCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/purchasing/items}">Open</a>
            </div></div>
        </div>
    </div>
</div>
</body>
</html>
