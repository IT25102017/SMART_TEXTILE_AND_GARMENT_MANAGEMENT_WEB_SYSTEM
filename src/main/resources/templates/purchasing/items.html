<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    Purchase Order Item - Supplier and Purchase Order Management
  </title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-4">


  <div class="d-flex justify-content-between align-items-center mb-3">

    <h2>
      Supplier and Purchase Order Management
    </h2>

    <a class="btn btn-dark btn-sm"
       th:href="@{/purchasing}">
      Dashboard
    </a>

  </div>


  <div class="mb-3">

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/purchasing/suppliers}">
      Supplier
    </a>

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/purchasing/requests}">
      Purchase Request
    </a>

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/purchasing/orders}">
      Purchase Order
    </a>

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/purchasing/items}">
      Purchase Order Item
    </a>

  </div>


  <div th:if="${message}"
       class="alert alert-success"
       th:text="${message}">
  </div>


  <div th:if="${error}"
       class="alert alert-danger"
       th:text="${error}">
  </div>


  <div class="card shadow-sm mb-4">

    <div class="card-header">

      <strong>
        Add / Edit Purchase Order Item
      </strong>

    </div>


    <div class="card-body">


      <form th:action="@{/purchasing/items/save}"
            th:object="${purchaseOrderItem}"
            method="post">


        <input type="hidden"
               th:field="*{poItemId}">


        <div class="row">


          <div class="col-md-6 mb-3">

            <label class="form-label">
              PO ID
            </label>

            <input class="form-control"
                   type="number"
                   th:field="*{poId}"
                   required>

          </div>


          <div class="col-md-6 mb-3">

            <label class="form-label">
              Material ID
            </label>

            <input class="form-control"
                   type="number"
                   th:field="*{materialId}"
                   required>

          </div>


          <div class="col-md-6 mb-3">

            <label class="form-label">
              Quantity
            </label>

            <input class="form-control"
                   type="number"
                   step="0.01"
                   th:field="*{quantity}"
                   required>

          </div>


          <div class="col-md-6 mb-3">

            <label class="form-label">
              Unit Price
            </label>

            <input class="form-control"
                   type="number"
                   step="0.01"
                   th:field="*{unitPrice}"
                   required>

          </div>


          <div class="col-md-6 mb-3">

            <label class="form-label">
              Received Quantity
            </label>

            <input class="form-control"
                   type="number"
                   step="0.01"
                   th:field="*{receivedQty}">

          </div>


        </div>


        <button class="btn btn-success"
                type="submit">
          Save
        </button>


        <a class="btn btn-secondary"
           th:href="@{/purchasing/items}">
          Clear
        </a>


      </form>


    </div>

  </div>


  <div class="card shadow-sm">

    <div class="card-header">

      <strong>
        Purchase Order Item List
      </strong>

    </div>


    <div class="card-body table-responsive">


      <table class="table table-striped table-bordered align-middle">


        <thead class="table-dark">

        <tr>

          <th>ID</th>
          <th>PO ID</th>
          <th>Material ID</th>
          <th>Quantity</th>
          <th>Unit Price</th>
          <th>Received Quantity</th>
          <th>Actions</th>

        </tr>

        </thead>


        <tbody>


        <tr th:each="row : ${itemsList}">


          <td th:text="${row.poItemId}"></td>

          <td th:text="${row.poId}"></td>

          <td th:text="${row.materialId}"></td>

          <td th:text="${row.quantity}"></td>

          <td th:text="${row.unitPrice}"></td>

          <td th:text="${row.receivedQty}"></td>


          <td class="text-nowrap">


            <a class="btn btn-warning btn-sm"
               th:href="@{/purchasing/items(editId=${row.poItemId})}">

              Edit

            </a>


            <form method="post"
                  class="d-inline"
                  th:action="@{/purchasing/items/delete/{id}(id=${row.poItemId})}">

              <button type="submit"
                      class="btn btn-danger btn-sm"
                      onclick="return confirm('WARNING: Permanently delete this Purchase Order Item?');">

                Delete

              </button>

            </form>


          </td>


        </tr>


        </tbody>


      </table>


    </div>

  </div>


</div>

</body>

</html>
