<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isEdit} ? 'Edit Supplier | LankaTex' : 'New Supplier | LankaTex'">
        Supplier | LankaTex
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common-navbar.css}">
    <link rel="stylesheet" th:href="@{/css/purchasing/purchasing-ui.css}">
    <link rel="stylesheet" th:href="@{/css/purchasing/purchasing-forms.css}">
</head>
<body class="purchasing-page">
<div th:replace="~{fragments/common-navbar :: navbar}"></div>
<main class="purchasing-container purchasing-form-workspace">
    <section class="purchasing-form-card">
        <div class="purchasing-form-heading">
            <span class="purchasing-eyebrow">LankaTex Purchasing</span>
            <h1 th:text="${isEdit} ? 'Edit Supplier' : 'New Supplier'">Supplier</h1>
            <p>
                Maintain supplier contact information used
                by LankaTex Purchase Orders.
            </p>
        </div>
        <form method="post"
              th:action="@{/purchasing/suppliers/save}"
              th:object="${supplier}">
            <input type="hidden" th:field="*{supplierId}">
            <input type="hidden" th:field="*{status}">
            <div class="purchasing-form-section">
                <h2 class="purchasing-form-section-title">Supplier Information</h2>
                <div class="mb-3">
                    <label class="form-label">Supplier Name</label>
                    <input class="form-control"
                           type="text"
                           th:field="*{supplierName}"
                           placeholder="Example: Lanka Fabric Suppliers"
                           required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contact Person</label>
                    <input class="form-control"
                           type="text"
                           th:field="*{contactPerson}"
                           placeholder="Example: Nimal Perera">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone</label>
                        <input class="form-control"
                               type="text"
                               th:field="*{phone}"
                               placeholder="0771234567">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input class="form-control"
                               type="email"
                               th:field="*{email}"
                               placeholder="supplier@example.com">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea class="form-control"
                              rows="4"
                              th:field="*{address}"
                              placeholder="Enter supplier address"></textarea>
                </div>
            </div>
            <div th:if="${isEdit}" class="line-total-box">
                Supplier Code:
                <strong th:text="${supplier.supplierCode}">SUP-001</strong>
            </div>
            <div class="purchasing-form-actions">
                <button class="purchasing-form-button purchasing-form-button-primary"
                        type="submit"
                        th:text="${isEdit} ? 'Update Supplier' : 'Save Supplier'">
                    Save Supplier
                </button>
                <a class="purchasing-form-button purchasing-form-button-secondary"
                   th:href="@{/purchasing/suppliers}">
                    Cancel
                </a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
