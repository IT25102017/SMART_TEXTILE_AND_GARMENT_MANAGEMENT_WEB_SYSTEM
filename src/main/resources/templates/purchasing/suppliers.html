<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    Suppliers - LankaTex
  </title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- Common LankaTex Navigation CSS -->
  <link rel="stylesheet"
        th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container py-4">


  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">

    <h2>
      Supplier Management
    </h2>

    <a class="btn btn-dark btn-sm"
       th:href="@{/purchasing}">
      Dashboard
    </a>

  </div>


  <!-- Purchasing Module Navigation -->
  <div class="mb-3">

    <a class="btn btn-primary btn-sm me-2 mb-2"
       th:href="@{/purchasing/suppliers}">
      Supplier
    </a>

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/purchasing/requests}">
      Purchase Request
    </a>

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/purchasing/orders}">
      Purchase Order
    </a>

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/purchasing/items}">
      Purchase Order Item
    </a>

  </div>


  <!-- Success Message -->
  <div th:if="${message}"
       class="alert alert-success"
       th:text="${message}">
  </div>


  <!-- Error Message -->
  <div th:if="${error}"
       class="alert alert-danger"
       th:text="${error}">
  </div>


  <!-- Supplier Form -->
  <div class="card shadow-sm mb-4">

    <div class="card-header">

      <strong>
        Add / Edit Supplier
      </strong>

    </div>


    <div class="card-body">

      <form th:action="@{/purchasing/suppliers/save}"
            th:object="${supplier}"
            method="post">

        <input type="hidden"
               th:field="*{supplierId}">


        <div class="row">


          <!-- Supplier Name -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Supplier Name
            </label>

            <input class="form-control"
                   type="text"
                   th:field="*{supplierName}"
                   required>

          </div>


          <!-- Contact Person -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Contact Person
            </label>

            <input class="form-control"
                   type="text"
                   th:field="*{contactPerson}">

          </div>


          <!-- Phone -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Phone
            </label>

            <input class="form-control"
                   type="text"
                   th:field="*{phone}">

          </div>


          <!-- Email -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Email
            </label>

            <input class="form-control"
                   type="email"
                   th:field="*{email}">

          </div>


          <!-- Address -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Address
            </label>

            <input class="form-control"
                   type="text"
                   th:field="*{address}">

          </div>


          <!-- Status -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Status
            </label>

            <input class="form-control"
                   type="text"
                   th:field="*{status}">

          </div>


        </div>


        <button class="btn btn-success"
                type="submit">
          Save
        </button>


        <a class="btn btn-secondary"
           th:href="@{/purchasing/suppliers}">
          Clear
        </a>


      </form>

    </div>

  </div>


  <!-- Supplier List -->
  <div class="card shadow-sm">

    <div class="card-header">

      <strong>
        Supplier List
      </strong>

    </div>


    <div class="card-body table-responsive">

      <table class="table table-striped table-bordered align-middle">

        <thead class="table-dark">

        <tr>

          <th>ID</th>
          <th>Supplier Name</th>
          <th>Contact Person</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Address</th>
          <th>Status</th>
          <th>Actions</th>

        </tr>

        </thead>


        <tbody>


        <tr th:each="row : ${suppliersList}">

          <td th:text="${row.supplierId}">
          </td>

          <td th:text="${row.supplierName}">
          </td>

          <td th:text="${row.contactPerson}">
          </td>

          <td th:text="${row.phone}">
          </td>

          <td th:text="${row.email}">
          </td>

          <td th:text="${row.address}">
          </td>


          <!-- Status -->
          <td>

                        <span th:if="${row.status == 'Archived'}"
                              class="badge bg-secondary">
                            Archived
                        </span>

            <span th:unless="${row.status == 'Archived'}"
                  class="badge bg-success"
                  th:text="${row.status}">
                        </span>

          </td>


          <!-- Actions -->
          <td class="text-nowrap">


            <!-- Edit -->
            <a class="btn btn-warning btn-sm"
               th:href="@{/purchasing/suppliers(editId=${row.supplierId})}">
              Edit
            </a>


            <!-- Archive -->
            <form th:if="${row.status != 'Archived'}"
                  method="post"
                  class="d-inline"
                  th:action="@{/purchasing/suppliers/archive/{id}(id=${row.supplierId})}">

              <button type="submit"
                      class="btn btn-secondary btn-sm"
                      onclick="return confirm('Archive this Supplier?');">
                Archive
              </button>

            </form>


            <!-- Restore -->
            <form th:if="${row.status == 'Archived'}"
                  method="post"
                  class="d-inline"
                  th:action="@{/purchasing/suppliers/restore/{id}(id=${row.supplierId})}">

              <button type="submit"
                      class="btn btn-success btn-sm"
                      onclick="return confirm('Restore this Supplier?');">
                Restore
              </button>

            </form>


            <!-- Delete -->
            <form method="post"
                  class="d-inline"
                  th:action="@{/purchasing/suppliers/delete/{id}(id=${row.supplierId})}">

              <button type="submit"
                      class="btn btn-danger btn-sm"
                      onclick="return confirm('WARNING: Permanently delete this Supplier?');">
                Delete
              </button>

            </form>


          </td>

        </tr>


        </tbody>

      </table>

    </div>

  </div>


</div>


</body>

</html>
