<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    Attendance Management - LankaTex
  </title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- Common LankaTex Navigation CSS -->
  <link rel="stylesheet"
        th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container py-4">


  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2>
      Attendance Management
    </h2>

    <a class="btn btn-dark"
       th:href="@{/hr}">
      Back to Dashboard
    </a>

  </div>


  <!-- HR Module Navigation -->
  <div class="mb-3">

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/hr/employees}">
      Employee
    </a>

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/hr/shifts}">
      Shift
    </a>

    <a class="btn btn-primary btn-sm me-2 mb-2"
       th:href="@{/hr/attendance}">
      Attendance Record
    </a>

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/hr/leaves}">
      Leave Request
    </a>

  </div>


  <!-- Success Message -->
  <div th:if="${message}"
       class="alert alert-success"
       th:text="${message}">
  </div>


  <!-- Error Message -->
  <div th:if="${error}"
       class="alert alert-danger"
       th:text="${error}">
  </div>


  <!-- Attendance Form -->
  <div class="card shadow-sm mb-4">

    <div class="card-header">

      <strong>
        Add / Edit Attendance Record
      </strong>

    </div>


    <div class="card-body">

      <form th:action="@{/hr/attendance/save}"
            th:object="${attendanceRecord}"
            method="post">


        <input type="hidden"
               th:field="*{attendanceId}">


        <div class="row">


          <!-- Employee ID -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Employee ID
            </label>

            <input class="form-control"
                   type="number"
                   th:field="*{employeeId}"
                   required>

          </div>


          <!-- Shift ID -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Shift ID
            </label>

            <input class="form-control"
                   type="number"
                   th:field="*{shiftId}"
                   required>

          </div>


          <!-- Attendance Date -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Attendance Date
            </label>

            <input class="form-control"
                   type="date"
                   th:field="*{attendanceDate}"
                   required>

          </div>


          <!-- Check In -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Check In
            </label>

            <input class="form-control"
                   type="time"
                   th:field="*{checkIn}">

          </div>


          <!-- Check Out -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Check Out
            </label>

            <input class="form-control"
                   type="time"
                   th:field="*{checkOut}">

          </div>


          <!-- Status -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Status
            </label>

            <input class="form-control"
                   type="text"
                   th:field="*{status}">

          </div>


          <!-- Working Hours -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Working Hours
            </label>

            <input class="form-control"
                   type="number"
                   step="0.01"
                   th:field="*{workingHours}">

          </div>


        </div>


        <button class="btn btn-success"
                type="submit">
          Save
        </button>


        <a class="btn btn-secondary"
           th:href="@{/hr/attendance}">
          Clear
        </a>


      </form>

    </div>

  </div>


  <!-- Attendance List -->
  <div class="card shadow-sm">

    <div class="card-header">

      <strong>
        Attendance Record List
      </strong>

    </div>


    <div class="card-body table-responsive">

      <table class="table table-striped table-bordered align-middle">


        <thead class="table-dark">

        <tr>

          <th>ID</th>
          <th>Employee ID</th>
          <th>Shift ID</th>
          <th>Attendance Date</th>
          <th>Check In</th>
          <th>Check Out</th>
          <th>Status</th>
          <th>Working Hours</th>
          <th>Actions</th>

        </tr>

        </thead>


        <tbody>


        <tr th:each="row : ${attendanceList}">


          <td th:text="${row.attendanceId}">
          </td>


          <td th:text="${row.employeeId}">
          </td>


          <td th:text="${row.shiftId}">
          </td>


          <td th:text="${row.attendanceDate}">
          </td>


          <td th:text="${row.checkIn}">
          </td>


          <td th:text="${row.checkOut}">
          </td>


          <!-- Status -->
          <td>

                        <span th:if="${row.status == 'Pending'}"
                              class="badge bg-warning text-dark">
                            Pending
                        </span>

            <span th:if="${row.status == 'Archived'}"
                  class="badge bg-secondary">
                            Archived
                        </span>

            <span th:if="${row.status != 'Pending'
                                      and row.status != 'Archived'}"
                  class="badge bg-info text-dark"
                  th:text="${row.status}">
                        </span>

          </td>


          <td th:text="${row.workingHours}">
          </td>


          <!-- Actions -->
          <td class="text-nowrap">


            <!-- Edit -->
            <a class="btn btn-warning btn-sm"
               th:href="@{/hr/attendance(editId=${row.attendanceId})}">
              Edit
            </a>


            <!-- Archive - only non archived records -->
            <a th:if="${row.status != 'Archived'}"
               class="btn btn-secondary btn-sm"
               th:href="@{/hr/attendance/archive/{id}(id=${row.attendanceId})}"
               onclick="return confirm('Archive this attendance record?');">
              Archive
            </a>


            <!-- Restore - only archived records -->
            <a th:if="${row.status == 'Archived'}"
               class="btn btn-success btn-sm"
               th:href="@{/hr/attendance/restore/{id}(id=${row.attendanceId})}"
               onclick="return confirm('Restore this attendance record back to Pending status?');">
              Restore
            </a>


            <!-- Permanent Delete -->
            <a class="btn btn-danger btn-sm"
               th:href="@{/hr/attendance/delete/{id}(id=${row.attendanceId})}"
               onclick="return confirm('WARNING: This will permanently delete the attendance record. Are you sure?');">
              Delete
            </a>


          </td>


        </tr>


        </tbody>


      </table>

    </div>

  </div>


</div>


</body>

</html>
