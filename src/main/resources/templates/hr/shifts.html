<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    Shift Management - LankaTex
  </title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- Common LankaTex Navigation CSS -->
  <link rel="stylesheet"
        th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container py-4">


  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2>
      Shift Management
    </h2>

    <a class="btn btn-dark"
       th:href="@{/hr}">
      Back to Dashboard
    </a>

  </div>


  <!-- HR Module Navigation -->
  <div class="mb-3">

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/hr/employees}">
      Employee
    </a>

    <a class="btn btn-primary btn-sm me-2 mb-2"
       th:href="@{/hr/shifts}">
      Shift
    </a>

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/hr/attendance}">
      Attendance Record
    </a>

    <a class="btn btn-outline-primary btn-sm me-2 mb-2"
       th:href="@{/hr/leaves}">
      Leave Request
    </a>

  </div>


  <!-- Success Message -->
  <div th:if="${message}"
       class="alert alert-success"
       th:text="${message}">
  </div>


  <!-- Error Message -->
  <div th:if="${error}"
       class="alert alert-danger"
       th:text="${error}">
  </div>


  <!-- Shift Form -->
  <div class="card shadow-sm mb-4">

    <div class="card-header">

      <strong>
        Add / Edit Shift
      </strong>

    </div>


    <div class="card-body">

      <form th:action="@{/hr/shifts/save}"
            th:object="${shift}"
            method="post">


        <input type="hidden"
               th:field="*{shiftId}">


        <div class="row">


          <!-- Shift Name -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Shift Name
            </label>

            <input class="form-control"
                   type="text"
                   th:field="*{shiftName}"
                   required>

          </div>


          <!-- Start Time -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Start Time
            </label>

            <input class="form-control"
                   type="time"
                   th:field="*{startTime}"
                   required>

          </div>


          <!-- End Time -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              End Time
            </label>

            <input class="form-control"
                   type="time"
                   th:field="*{endTime}"
                   required>

          </div>


          <!-- Break Duration -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Break Duration (minutes)
            </label>

            <input class="form-control"
                   type="number"
                   th:field="*{breakDuration}">

          </div>


          <!-- Working Days -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Working Days
            </label>

            <input class="form-control"
                   type="text"
                   th:field="*{workingDays}">

          </div>


          <!-- Status -->
          <div class="col-md-6 mb-3">

            <label class="form-label">
              Status
            </label>

            <input class="form-control"
                   type="text"
                   th:field="*{status}">

          </div>


        </div>


        <button class="btn btn-success"
                type="submit">
          Save
        </button>


        <a class="btn btn-secondary"
           th:href="@{/hr/shifts}">
          Clear
        </a>


      </form>

    </div>

  </div>


  <!-- Shift List -->
  <div class="card shadow-sm">

    <div class="card-header">

      <strong>
        Shift List
      </strong>

    </div>


    <div class="card-body table-responsive">

      <table class="table table-striped table-bordered align-middle">


        <thead class="table-dark">

        <tr>

          <th>ID</th>
          <th>Shift Name</th>
          <th>Start Time</th>
          <th>End Time</th>
          <th>Break Duration (minutes)</th>
          <th>Working Days</th>
          <th>Status</th>
          <th>Actions</th>

        </tr>

        </thead>


        <tbody>


        <tr th:each="row : ${shiftsList}">


          <td th:text="${row.shiftId}">
          </td>


          <td th:text="${row.shiftName}">
          </td>


          <td th:text="${row.startTime}">
          </td>


          <td th:text="${row.endTime}">
          </td>


          <td th:text="${row.breakDuration}">
          </td>


          <td th:text="${row.workingDays}">
          </td>


          <td th:text="${row.status}">
          </td>


          <!-- Actions -->
          <td class="text-nowrap">


            <!-- Edit -->
            <a class="btn btn-warning btn-sm"
               th:href="@{/hr/shifts(editId=${row.shiftId})}">
              Edit
            </a>


            <!-- Archive -->
            <a class="btn btn-outline-danger btn-sm"
               th:href="@{/hr/shifts/archive/{id}(id=${row.shiftId})}"
               onclick="return confirm('Archive this shift record?');">
              Archive
            </a>


          </td>


        </tr>


        </tbody>


      </table>

    </div>

  </div>


</div>


</body>

</html>
