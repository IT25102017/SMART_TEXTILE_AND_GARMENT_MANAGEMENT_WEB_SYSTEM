<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Employee and Attendance Management
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container py-4">


    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>
            Employee and Attendance Management
        </h2>

        <a class="btn btn-dark btn-sm"
           th:href="@{/hr}">
            Dashboard
        </a>

    </div>


    <!-- HR Module Navigation -->
    <div class="mb-3">

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/hr/employees}">
            Employee
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/hr/shifts}">
            Shift
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/hr/attendance}">
            Attendance
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/hr/leaves}">
            Leave Request
        </a>

    </div>


    <!-- Dashboard Summary Cards -->
    <div class="row">


        <!-- Employee Card -->
        <div class="col-md-3 mb-3">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h6 class="text-muted">
                        Employee
                    </h6>

                    <h2 th:text="${stats.employeeCount}">
                        0
                    </h2>

                    <a class="btn btn-primary btn-sm"
                       th:href="@{/hr/employees}">
                        Open
                    </a>

                </div>

            </div>

        </div>


        <!-- Shift Card -->
        <div class="col-md-3 mb-3">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h6 class="text-muted">
                        Shift
                    </h6>

                    <h2 th:text="${stats.shiftCount}">
                        0
                    </h2>

                    <a class="btn btn-primary btn-sm"
                       th:href="@{/hr/shifts}">
                        Open
                    </a>

                </div>

            </div>

        </div>


        <!-- Attendance Card -->
        <div class="col-md-3 mb-3">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h6 class="text-muted">
                        Attendance
                    </h6>

                    <h2 th:text="${stats.attendanceRecordCount}">
                        0
                    </h2>

                    <a class="btn btn-primary btn-sm"
                       th:href="@{/hr/attendance}">
                        Open
                    </a>

                </div>

            </div>

        </div>


        <!-- Leave Request Card -->
        <div class="col-md-3 mb-3">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h6 class="text-muted">
                        Leave Request
                    </h6>

                    <h2 th:text="${stats.leaveRequestCount}">
                        0
                    </h2>

                    <a class="btn btn-primary btn-sm"
                       th:href="@{/hr/leaves}">
                        Open
                    </a>

                </div>

            </div>

        </div>


    </div>

</div>


</body>

</html>
