<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave Request - Employee and Attendance Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Employee and Attendance Management</h2>
    <a class="btn btn-dark btn-sm" th:href="@{/hr}">Dashboard</a>
  </div>
  <div class="mb-3">
    <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/hr/employees}">Employee</a>
    <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/hr/shifts}">Shift</a>
    <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/hr/attendance}">Attendance Record</a>
    <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/hr/leaves}">Leave Request</a>
  </div>
  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  <div class="card shadow-sm mb-4">
    <div class="card-header"><strong>Add / Edit Leave Request</strong></div>
    <div class="card-body">
      <form th:action="@{/hr/leaves/save}" th:object="${leaveRequest}" method="post">
        <input type="hidden" th:field="*{leaveId}">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Employee ID</label>
            <input class="form-control" type="number" th:field="*{employeeId}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Leave Type</label>
            <input class="form-control" type="text" th:field="*{leaveType}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Start Date</label>
            <input class="form-control" type="date" th:field="*{startDate}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">End Date</label>
            <input class="form-control" type="date" th:field="*{endDate}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Reason</label>
            <input class="form-control" type="text" th:field="*{reason}" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Status</label>
            <input class="form-control" type="text" th:field="*{status}">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Approved By User ID</label>
            <input class="form-control" type="number" th:field="*{approvedBy}">
          </div>
        </div>
        <button class="btn btn-success" type="submit">Save</button>
        <a class="btn btn-secondary" th:href="@{/hr/leaves}">Clear</a>
      </form>
    </div>
  </div>
  <div class="card shadow-sm">
    <div class="card-header"><strong>Leave Request List</strong></div>
    <div class="card-body table-responsive">
      <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark"><tr><th>ID</th><th>Employee ID</th><th>Leave Type</th><th>Start Date</th><th>End
          Date</th><th>Reason</th><th>Status</th><th>Approved By User ID</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="row : ${leavesList}">
          <td th:text="${row.leaveId}"></td><td th:text="${row.employeeId}"></td><td
                th:text="${row.leaveType}"></td><td th:text="${row.startDate}"></td><td th:text="${row.endDate}"></td><td
                th:text="${row.reason}"></td><td th:text="${row.status}"></td><td th:text="${row.approvedBy}"></td>
          <td class="text-nowrap"><a class="btn btn-warning btn-sm"
                                     th:href="@{/hr/leaves(editId=${row.leaveId})}">Edit</a> <a class="btn btn-outline-danger btn-sm"
                                                                                                th:href="@{/hr/leaves/archive/{id}(id=${row.leaveId})}" onclick="return confirm('Archive this record?')">Archive</a></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
