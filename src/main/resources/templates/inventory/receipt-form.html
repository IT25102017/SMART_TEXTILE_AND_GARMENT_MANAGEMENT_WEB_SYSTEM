<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${isEdit}
                    ? 'Edit Goods Receipt | LankaTex'
                    : 'New Goods Receipt | LankaTex'">
        Goods Receipt | LankaTex
    </title>


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common-navbar.css}">


    <!-- Inventory Main Theme -->
    <link rel="stylesheet"
          th:href="@{/css/inventory/inventory-ui.css}">


    <!-- Goods Receipts Theme -->
    <link rel="stylesheet"
          th:href="@{/css/inventory/inventory-receipts.css}">

</head>


<body class="inventory-page">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<main class="inventory-container receipt-form-workspace">


    <!-- =====================================================
         GOODS RECEIPT FORM
         ===================================================== -->

    <section class="receipt-form-card">


        <!-- Form Heading -->

        <div class="receipt-form-heading">

            <span class="receipts-eyebrow">
                LankaTex Inventory
            </span>


            <h1 th:text="${isEdit}
                        ? 'Edit Goods Receipt'
                        : 'New Goods Receipt'">

                Goods Receipt

            </h1>


            <p th:text="${isEdit}
                       ? 'Update the receiving information for this goods receipt.'
                       : 'Record goods received from a supplier against a purchase order.'">
            </p>

        </div>



        <!-- =================================================
             ERROR MESSAGE
             ================================================= -->

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>



        <!-- =================================================
             FORM
             ================================================= -->

        <form method="post"
              th:action="@{/inventory/receipts/save}"
              th:object="${receipt}">


            <!-- =================================================
                 RECEIPT ID
                 ================================================= -->

            <input type="hidden"
                   th:field="*{receiptId}">



            <!-- =================================================
                 PURCHASE ORDER ID
                 ================================================= -->

            <div class="mb-3">

                <label class="form-label">
                    Purchase Order ID
                </label>


                <input type="number"
                       class="form-control"
                       th:field="*{poId}"
                       th:readonly="${isEdit}"
                       required>


                <small th:if="${isEdit}"
                       class="text-muted">

                    Purchase Order ID cannot be changed after the receipt is created.

                </small>

            </div>



            <!-- =================================================
                 SUPPLIER ID
                 ================================================= -->

            <div class="mb-3">

                <label class="form-label">
                    Supplier ID
                </label>


                <input type="number"
                       class="form-control"
                       th:field="*{supplierId}"
                       th:readonly="${isEdit}"
                       required>


                <small th:if="${isEdit}"
                       class="text-muted">

                    Supplier ID cannot be changed after the receipt is created.

                </small>

            </div>



            <!-- =================================================
                 RECEIVED DATE
                 ================================================= -->

            <div class="mb-3">

                <label class="form-label">
                    Received Date
                </label>


                <input type="date"
                       class="form-control"
                       th:field="*{receivedDate}"
                       required>

            </div>



            <!-- =================================================
                 RECEIVED BY USER ID
                 ================================================= -->

            <div class="mb-3">

                <label class="form-label">
                    Received By User ID
                </label>


                <input type="number"
                       class="form-control"
                       th:field="*{receivedBy}">

            </div>



            <!-- =================================================
                 STATUS
                 ================================================= -->

            <div class="mb-3">

                <label class="form-label">
                    Status
                </label>


                <!-- Normal Receipt Status -->

                <select th:if="${receipt.status != 'ARCHIVED'}"
                        class="form-select"
                        th:field="*{status}">

                    <option value="RECEIVED">
                        RECEIVED
                    </option>

                    <option value="PENDING">
                        PENDING
                    </option>

                    <option value="REJECTED">
                        REJECTED
                    </option>

                </select>



                <!-- Archived Receipt Status -->

                <input th:if="${receipt.status == 'ARCHIVED'}"
                       type="text"
                       class="form-control"
                       value="ARCHIVED"
                       readonly>


                <input th:if="${receipt.status == 'ARCHIVED'}"
                       type="hidden"
                       th:field="*{status}">


                <small th:if="${receipt.status == 'ARCHIVED'}"
                       class="text-muted">

                    Use the Restore button from the Goods Receipt list
                    to reactivate this record.

                </small>

            </div>



            <!-- =================================================
                 REMARKS
                 ================================================= -->

            <div class="mb-4">

                <label class="form-label">
                    Remarks
                </label>


                <textarea class="form-control"
                          rows="4"
                          maxlength="500"
                          th:field="*{remarks}">
                </textarea>

            </div>



            <!-- =================================================
                 FORM ACTIONS
                 ================================================= -->

            <div class="d-flex gap-2 flex-wrap">


                <button type="submit"
                        class="btn btn-success"
                        th:text="${isEdit}
                                 ? 'Update Receipt'
                                 : 'Save Receipt'">

                    Save Receipt

                </button>


                <a class="btn btn-secondary"
                   th:href="@{/inventory/receipts}">

                    Cancel

                </a>


            </div>


        </form>


    </section>


</main>


</body>

</html>
