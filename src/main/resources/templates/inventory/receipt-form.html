<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Goods Receipt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container py-4">

    <h2>Goods Receipt</h2>

    <form method="post"
          th:action="@{/inventory/receipts/save}"
          th:object="${receipt}">

        <div class="mb-3">

            <label>Purchase Order ID</label>

            <input type="number"
                   class="form-control"
                   th:field="*{poId}">

        </div>

        <div class="mb-3">

            <label>Supplier ID</label>

            <input type="number"
                   class="form-control"
                   th:field="*{supplierId}">

        </div>

        <div class="mb-3">

            <label>Received Date</label>

            <input type="date"
                   class="form-control"
                   th:field="*{receivedDate}">

        </div>

        <div class="mb-3">

            <label>Received By User ID</label>

            <input type="number"
                   class="form-control"
                   th:field="*{receivedBy}">

        </div>

        <div class="mb-3">

            <label>Status</label>

            <select class="form-select"
                    th:field="*{status}">

                <option value="RECEIVED">RECEIVED</option>
                <option value="PENDING">PENDING</option>
                <option value="REJECTED">REJECTED</option>

            </select>

        </div>

        <div class="mb-3">

            <label>Remarks</label>

            <textarea class="form-control"
                      th:field="*{remarks}">
            </textarea>

        </div>

        <button class="btn btn-success">
            Save
        </button>

    </form>

</div>

</body>
</html>
