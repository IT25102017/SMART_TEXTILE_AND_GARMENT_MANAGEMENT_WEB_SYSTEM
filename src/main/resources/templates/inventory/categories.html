<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Material Categories - LankaTex</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet" th:href="@{/css/common-navbar.css}">
</head>

<body class="bg-light">

<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>

<div class="container py-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Material Categories</h2>

        <div class="d-flex gap-2">

            <a class="btn btn-dark"
               th:href="@{/inventory}">
                Back to Dashboard
            </a>

            <a class="btn btn-primary"
               th:href="@{/inventory/categories/new}">
                Add Category
            </a>

        </div>

    </div>

    <!-- Category List -->
    <div class="card shadow-sm">

        <div class="card-header">
            <strong>Material Category List</strong>
        </div>

        <div class="card-body table-responsive">

            <table class="table table-bordered table-striped align-middle">

                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="category : ${categories}">

                    <td th:text="${category.categoryId}"></td>

                    <td th:text="${category.categoryName}"></td>

                    <td th:text="${category.description}"></td>

                    <td th:text="${category.status}"></td>

                    <td>

                        <a class="btn btn-sm btn-warning"
                           th:href="@{/inventory/categories/edit/{id}(id=${category.categoryId})}">
                            Edit
                        </a>

                        <form class="d-inline"
                              method="post"
                              th:action="@{/inventory/categories/archive/{id}(id=${category.categoryId})}">

                            <button class="btn btn-sm btn-danger"
                                    type="submit">
                                Archive
                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
