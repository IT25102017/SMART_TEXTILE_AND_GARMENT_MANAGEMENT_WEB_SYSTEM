<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Material Categories</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container py-4">

    <div class="d-flex justify-content-between">

        <h2>Material Categories</h2>

        <a class="btn btn-primary"
           th:href="@{/inventory/categories/new}">
            Add Category
        </a>

    </div>


    <!-- Success Message -->
    <div th:if="${message}"
         class="alert alert-success mt-3"
         th:text="${message}">
    </div>


    <!-- Error Message -->
    <div th:if="${error}"
         class="alert alert-danger mt-3"
         th:text="${error}">
    </div>


    <table class="table table-bordered mt-4">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Category</th>
            <th>Description</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>

        </thead>


        <tbody>

        <tr th:each="category : ${categories}">

            <td th:text="${category.categoryId}">
            </td>

            <td th:text="${category.categoryName}">
            </td>

            <td th:text="${category.description}">
            </td>

            <td th:text="${category.status}">
            </td>

            <td>

                <!-- UPDATE -->
                <a class="btn btn-sm btn-warning"
                   th:href="@{/inventory/categories/edit/{id}
                   (id=${category.categoryId})}">

                    Edit

                </a>


                <!-- SOFT DELETE -->
                <form class="d-inline"
                      method="post"
                      th:action="@{/inventory/categories/archive/{id}
                      (id=${category.categoryId})}">

                    <button class="btn btn-sm btn-secondary"
                            type="submit"
                            onclick="return confirm('Are you sure you want to archive this category?');">

                        Archive

                    </button>

                </form>


                <!-- HARD DELETE -->
                <form class="d-inline"
                      method="post"
                      th:action="@{/inventory/categories/delete/{id}
                      (id=${category.categoryId})}">

                    <button class="btn btn-sm btn-danger"
                            type="submit"
                            onclick="return confirm('WARNING: This will permanently delete the category. Are you sure?');">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <a th:href="@{/inventory}">
        Back to Dashboard
    </a>

</div>

</body>

</html>
