<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Material Categories - LankaTex
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container py-4">


    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Material Categories
        </h2>


        <div class="d-flex gap-2">

            <a class="btn btn-dark"
               th:href="@{/inventory}">
                Back to Dashboard
            </a>


            <a class="btn btn-primary"
               th:href="@{/inventory/categories/new}">
                Add Category
            </a>

        </div>

    </div>


    <!-- Success Message -->
    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>


    <!-- Error Message -->
    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <!-- Category List -->
    <div class="card shadow-sm">


        <div class="card-header">

            <strong>
                Material Category List
            </strong>

        </div>


        <div class="card-body table-responsive">


            <table class="table table-bordered table-striped align-middle">


                <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>


                <tr th:each="category : ${categories}">


                    <td th:text="${category.categoryId}">
                    </td>


                    <td th:text="${category.categoryName}">
                    </td>


                    <td th:text="${category.description}">
                    </td>


                    <!-- Category Status -->
                    <td>


                        <span th:if="${category.status == 'ACTIVE'}"
                              class="badge bg-success">
                            ACTIVE
                        </span>


                        <span th:if="${category.status == 'ARCHIVED'}"
                              class="badge bg-secondary">
                            ARCHIVED
                        </span>


                        <span th:if="${category.status != 'ACTIVE'
                                      and category.status != 'ARCHIVED'}"
                              class="badge bg-info text-dark"
                              th:text="${category.status}">
                        </span>


                    </td>


                    <!-- Actions -->
                    <td class="text-nowrap">


                        <!-- Edit -->
                        <a class="btn btn-sm btn-warning"
                           th:href="@{/inventory/categories/edit/{id}
                           (id=${category.categoryId})}">
                            Edit
                        </a>


                        <!-- Archive - ACTIVE only -->
                        <form th:if="${category.status == 'ACTIVE'}"
                              class="d-inline"
                              method="post"
                              th:action="@{/inventory/categories/archive/{id}
                              (id=${category.categoryId})}">

                            <button class="btn btn-sm btn-secondary"
                                    type="submit"
                                    onclick="return confirm('Are you sure you want to archive this category?');">
                                Archive
                            </button>

                        </form>


                        <!-- Restore - ARCHIVED only -->
                        <form th:if="${category.status == 'ARCHIVED'}"
                              class="d-inline"
                              method="post"
                              th:action="@{/inventory/categories/restore/{id}
                              (id=${category.categoryId})}">

                            <button class="btn btn-sm btn-success"
                                    type="submit"
                                    onclick="return confirm('Restore this category back to ACTIVE status?');">
                                Restore
                            </button>

                        </form>


                        <!-- Permanent Delete -->
                        <form class="d-inline"
                              method="post"
                              th:action="@{/inventory/categories/delete/{id}
                              (id=${category.categoryId})}">

                            <button class="btn btn-sm btn-danger"
                                    type="submit"
                                    onclick="return confirm('WARNING: This will permanently delete the category. Are you sure?');">
                                Delete
                            </button>

                        </form>


                    </td>


                </tr>


                </tbody>


            </table>


        </div>


    </div>


</div>


</body>

</html>
