<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stock Adjustments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container py-4">

    <div class="d-flex justify-content-between">

        <h2>Stock Adjustments</h2>

        <a class="btn btn-primary"
           th:href="@{/inventory/adjustments/new}">
            New Adjustment
        </a>

    </div>

    <table class="table table-bordered mt-4">

        <thead class="table-dark">
        <tr>
            <th>Material</th>
            <th>Batch</th>
            <th>Previous</th>
            <th>Adjusted</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="adjustment : ${adjustments}">

            <td th:text="${adjustment.material.materialName}"></td>

            <td th:text="${adjustment.batch.batchNo}"></td>

            <td th:text="${adjustment.previousQty}"></td>

            <td th:text="${adjustment.adjustedQty}"></td>

            <td th:text="${adjustment.reason}"></td>

            <td th:text="${adjustment.approvalStatus}"></td>

            <td>

                <form th:if="${adjustment.approvalStatus == 'PENDING'}"
                      method="post"
                      th:action="@{/inventory/adjustments/approve/{id}
                      (id=${adjustment.adjustmentId})}">

                    <input type="number"
                           name="approvedBy"
                           value="1"
                           required
                           style="width: 90px">

                    <button class="btn btn-sm btn-success">
                        Approve
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
