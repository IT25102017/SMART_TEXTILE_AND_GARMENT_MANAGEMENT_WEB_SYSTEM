<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Stock Adjustments - LankaTex</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet" th:href="@{/css/common-navbar.css}">
</head>

<body class="bg-light">

<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>

<div class="container py-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Stock Adjustments</h2>

        <div class="d-flex gap-2">

            <a class="btn btn-dark"
               th:href="@{/inventory}">
                Back to Dashboard
            </a>

            <a class="btn btn-primary"
               th:href="@{/inventory/adjustments/new}">
                New Adjustment
            </a>

        </div>

    </div>

    <!-- Stock Adjustment List -->
    <div class="card shadow-sm">

        <div class="card-header">
            <strong>Stock Adjustment List</strong>
        </div>

        <div class="card-body table-responsive">

            <table class="table table-bordered table-striped align-middle">

                <thead class="table-dark">
                <tr>
                    <th>Material</th>
                    <th>Batch</th>
                    <th>Previous</th>
                    <th>Adjusted</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="adjustment : ${adjustments}">

                    <td th:text="${adjustment.material.materialName}"></td>
                    <td th:text="${adjustment.batch.batchNo}"></td>
                    <td th:text="${adjustment.previousQty}"></td>
                    <td th:text="${adjustment.adjustedQty}"></td>
                    <td th:text="${adjustment.reason}"></td>
                    <td th:text="${adjustment.approvalStatus}"></td>

                    <td>

                        <form th:if="${adjustment.approvalStatus == 'PENDING'}"
                              method="post"
                              th:action="@{/inventory/adjustments/approve/{id}(id=${adjustment.adjustmentId})}">

                            <div class="d-flex gap-2">

                                <input type="number"
                                       name="approvedBy"
                                       value="1"
                                       required
                                       class="form-control form-control-sm"
                                       style="width: 90px">

                                <button type="submit"
                                        class="btn btn-success btn-sm">
                                    Approve
                                </button>

                            </div>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
