<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Material Batches - LankaTex</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet" th:href="@{/css/common-navbar.css}">
</head>

<body class="bg-light">

<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>

<div class="container py-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Material Batches</h2>

        <div class="d-flex gap-2">

            <a class="btn btn-dark"
               th:href="@{/inventory}">
                Back to Dashboard
            </a>

            <a class="btn btn-primary"
               th:href="@{/inventory/batches/new}">
                Receive Material Batch
            </a>

        </div>

    </div>

    <!-- Material Batch List -->
    <div class="card shadow-sm">

        <div class="card-header">
            <strong>Material Batch List</strong>
        </div>

        <div class="card-body table-responsive">

            <table class="table table-bordered table-striped align-middle">

                <thead class="table-dark">
                <tr>
                    <th>Batch</th>
                    <th>Material</th>
                    <th>Supplier ID</th>
                    <th>Date</th>
                    <th>Cost</th>
                    <th>Available Qty</th>
                    <th>Location</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="batch : ${batches}">

                    <td th:text="${batch.batchNo}"></td>

                    <td th:text="${batch.material.materialName}"></td>

                    <td th:text="${batch.supplierId}"></td>

                    <td th:text="${batch.receivedDate}"></td>

                    <td th:text="${batch.unitCost}"></td>

                    <td th:text="${batch.availableQty}"></td>

                    <td th:text="${batch.location}"></td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
