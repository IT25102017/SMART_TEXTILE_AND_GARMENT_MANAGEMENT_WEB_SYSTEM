<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Material Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container py-4">

    <h2>Material Form</h2>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <form method="post"
          th:object="${material}"
          th:action="@{/inventory/materials/save}">

        <input type="hidden"
               th:field="*{materialId}">

        <input type="hidden"
               th:field="*{status}">

        <div class="mb-3">
            <label>Material Code</label>

            <input class="form-control"
                   th:field="*{materialCode}">

            <small class="text-danger"
                   th:errors="*{materialCode}">
            </small>
        </div>

        <div class="mb-3">

            <label>Material Name</label>

            <input class="form-control"
                   th:field="*{materialName}">

            <small class="text-danger"
                   th:errors="*{materialName}">
            </small>

        </div>

        <div class="mb-3">

            <label>Category</label>

            <select class="form-select"
                    name="categoryId"
                    required>

                <option th:each="category : ${categories}"
                        th:value="${category.categoryId}"
                        th:selected="${material.category != null
                        and material.category.categoryId
                        == category.categoryId}"
                        th:text="${category.categoryName}">
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label>Colour / Specification</label>

            <input class="form-control"
                   th:field="*{colour}">

        </div>

        <div class="mb-3">

            <label>Unit</label>

            <select class="form-select"
                    th:field="*{unit}">

                <option value="Meters">Meters</option>
                <option value="Kilograms">Kilograms</option>
                <option value="Pieces">Pieces</option>
                <option value="Rolls">Rolls</option>
                <option value="Boxes">Boxes</option>

            </select>

        </div>

        <div class="mb-3">

            <label>Reorder Level</label>

            <input type="number"
                   step="0.01"
                   min="0"
                   class="form-control"
                   th:field="*{reorderLevel}">

        </div>

        <button class="btn btn-success">
            Save
        </button>

        <a class="btn btn-secondary"
           th:href="@{/inventory/materials}">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
