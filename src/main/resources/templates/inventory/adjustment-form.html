<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stock Adjustment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container py-4">

    <h2>Stock Adjustment</h2>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <form method="post"
          th:action="@{/inventory/adjustments/save}"
          th:object="${adjustment}">

        <div class="mb-3">

            <label>Batch</label>

            <select class="form-select"
                    name="batchId">

                <option th:each="batch : ${batches}"
                        th:value="${batch.batchId}"
                        th:text="${batch.batchNo
                        + ' - '
                        + batch.material.materialName
                        + ' ('
                        + batch.availableQty
                        + ')'}">
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label>New Quantity</label>

            <input type="number"
                   step="0.01"
                   min="0"
                   class="form-control"
                   th:field="*{adjustedQty}">

        </div>

        <div class="mb-3">

            <label>Reason</label>

            <textarea class="form-control"
                      th:field="*{reason}">
            </textarea>

        </div>

        <button class="btn btn-success">
            Submit Adjustment
        </button>

    </form>

</div>

</body>
</html>
