<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Material Category | LankaTex</title>


    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common-navbar.css}">


    <!-- Inventory Main Theme -->
    <link rel="stylesheet"
          th:href="@{/css/inventory/inventory-ui.css}">


    <!-- Inventory Categories Theme -->
    <link rel="stylesheet"
          th:href="@{/css/inventory/inventory-categories.css}">


    <!-- Shared Inventory Form Theme -->
    <link rel="stylesheet"
          th:href="@{/css/inventory/inventory-forms.css}">

</head>


<body class="inventory-page">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<main class="inventory-container inventory-form-workspace">


    <!-- =====================================================
         CATEGORY FORM CARD
         ===================================================== -->

    <section class="inventory-form-card">


        <!-- =================================================
             FORM HEADING
             ================================================= -->

        <div class="inventory-form-heading">


            <span class="inventory-form-eyebrow">
                LankaTex Inventory
            </span>


            <h1>
                Material Category
            </h1>


            <p>
                Create or update material categories used to organize
                textile inventory and improve stock management across
                LankaTex operations.
            </p>


        </div>



        <!-- =================================================
             ERROR MESSAGE
             ================================================= -->

        <div th:if="${error}"
             class="alert alert-danger inventory-form-alert"
             th:text="${error}">
        </div>



        <!-- =================================================
             CATEGORY FORM
             ================================================= -->

        <form th:action="@{/inventory/categories/save}"
              th:object="${category}"
              method="post">


            <!-- Category ID -->

            <input type="hidden"
                   th:field="*{categoryId}">


            <!-- Category Status -->

            <input type="hidden"
                   th:field="*{status}">



            <!-- =================================================
                 CATEGORY INFORMATION
                 ================================================= -->

            <div class="inventory-form-section">


                <h2 class="inventory-form-section-title">
                    Category Information
                </h2>



                <!-- Category Name -->

                <div class="mb-3">


                    <label class="form-label">
                        Category Name
                    </label>


                    <input type="text"
                           class="form-control"
                           th:field="*{categoryName}"
                           placeholder="Example: Fabric Materials">


                    <small class="inventory-field-error"
                           th:if="${#fields.hasErrors('categoryName')}"
                           th:errors="*{categoryName}">
                    </small>


                </div>



                <!-- Description -->

                <div class="mb-3">


                    <label class="form-label">
                        Description
                    </label>


                    <textarea class="form-control"
                              rows="5"
                              maxlength="500"
                              th:field="*{description}"
                              placeholder="Enter a short description of this material category.">
                    </textarea>


                    <small class="inventory-field-help">
                        Add a clear description to help identify the purpose
                        of this category.
                    </small>


                </div>


            </div>



            <!-- =================================================
                 FORM ACTIONS
                 ================================================= -->

            <div class="inventory-form-actions">


                <button type="submit"
                        class="inventory-form-button
                               inventory-form-button-primary">

                    Save Category

                </button>


                <a class="inventory-form-button
                          inventory-form-button-secondary"
                   th:href="@{/inventory/categories}">

                    Cancel

                </a>


            </div>


        </form>


    </section>


</main>


</body>

</html>
