<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stock Movements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container py-4">

    <div class="d-flex justify-content-between">

        <h2>Stock Movements</h2>

        <a class="btn btn-primary"
           th:href="@{/inventory/movements/new}">
            New Movement
        </a>

    </div>

    <table class="table table-bordered mt-4">

        <thead class="table-dark">
        <tr>
            <th>Date</th>
            <th>Material</th>
            <th>Batch</th>
            <th>Type</th>
            <th>Quantity</th>
            <th>Reference</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="movement : ${movements}">

            <td th:text="${movement.movementDate}"></td>

            <td th:text="${movement.material.materialName}"></td>

            <td th:text="${movement.batch != null
            ? movement.batch.batchNo : '-'}"></td>

            <td th:text="${movement.movementType}"></td>

            <td th:text="${movement.quantity}"></td>

            <td th:text="${movement.referenceType}"></td>

        </tr>

        </tbody>

    </table>

    <a th:href="@{/inventory}">
        Back to Dashboard
    </a>

</div>

</body>
</html>
