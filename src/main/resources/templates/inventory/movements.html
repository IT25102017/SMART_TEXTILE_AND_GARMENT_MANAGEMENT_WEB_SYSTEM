<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Stock Movements - LankaTex</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet" th:href="@{/css/common-navbar.css}">
</head>

<body class="bg-light">

<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>

<div class="container py-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Stock Movements</h2>

        <div class="d-flex gap-2">

            <a class="btn btn-dark"
               th:href="@{/inventory}">
                Back to Dashboard
            </a>

            <a class="btn btn-primary"
               th:href="@{/inventory/movements/new}">
                New Movement
            </a>

        </div>

    </div>

    <!-- Stock Movement List -->
    <div class="card shadow-sm">

        <div class="card-header">
            <strong>Stock Movement List</strong>
        </div>

        <div class="card-body table-responsive">

            <table class="table table-bordered table-striped align-middle">

                <thead class="table-dark">
                <tr>
                    <th>Date</th>
                    <th>Material</th>
                    <th>Batch</th>
                    <th>Type</th>
                    <th>Quantity</th>
                    <th>Reference</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="movement : ${movements}">

                    <td th:text="${movement.movementDate}"></td>

                    <td th:text="${movement.material.materialName}"></td>

                    <td th:text="${movement.batch != null ? movement.batch.batchNo : '-'}"></td>

                    <td th:text="${movement.movementType}"></td>

                    <td th:text="${movement.quantity}"></td>

                    <td th:text="${movement.referenceType}"></td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
