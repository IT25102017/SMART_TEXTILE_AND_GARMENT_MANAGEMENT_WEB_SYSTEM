<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Goods Receipts - LankaTex</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet" th:href="@{/css/common-navbar.css}">
</head>

<body class="bg-light">

<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>

<div class="container py-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Goods Receipts</h2>

        <div class="d-flex gap-2">

            <a class="btn btn-dark"
               th:href="@{/inventory}">
                Back to Dashboard
            </a>

            <a class="btn btn-primary"
               th:href="@{/inventory/receipts/new}">
                New Goods Receipt
            </a>

        </div>

    </div>

    <!-- Goods Receipt List -->
    <div class="card shadow-sm">

        <div class="card-header">
            <strong>Goods Receipt List</strong>
        </div>

        <div class="card-body table-responsive">

            <table class="table table-bordered table-striped align-middle">

                <thead class="table-dark">
                <tr>
                    <th>Receipt ID</th>
                    <th>PO ID</th>
                    <th>Supplier ID</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Remarks</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="receipt : ${receipts}">

                    <td th:text="${receipt.receiptId}"></td>
                    <td th:text="${receipt.poId}"></td>
                    <td th:text="${receipt.supplierId}"></td>
                    <td th:text="${receipt.receivedDate}"></td>
                    <td th:text="${receipt.status}"></td>
                    <td th:text="${receipt.remarks}"></td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
