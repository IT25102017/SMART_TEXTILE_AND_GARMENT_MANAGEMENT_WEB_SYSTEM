<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Goods Receipts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container py-4">

    <div class="d-flex justify-content-between">

        <h2>Goods Receipts</h2>

        <a class="btn btn-primary"
           th:href="@{/inventory/receipts/new}">
            New Goods Receipt
        </a>

    </div>

    <table class="table table-bordered mt-4">

        <thead class="table-dark">
        <tr>
            <th>Receipt ID</th>
            <th>PO ID</th>
            <th>Supplier ID</th>
            <th>Date</th>
            <th>Status</th>
            <th>Remarks</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="receipt : ${receipts}">

            <td th:text="${receipt.receiptId}"></td>

            <td th:text="${receipt.poId}"></td>

            <td th:text="${receipt.supplierId}"></td>

            <td th:text="${receipt.receivedDate}"></td>

            <td th:text="${receipt.status}"></td>

            <td th:text="${receipt.remarks}"></td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
