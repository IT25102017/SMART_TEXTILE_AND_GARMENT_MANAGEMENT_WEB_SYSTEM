<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Low Stock Items - LankaTex</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet" th:href="@{/css/common-navbar.css}">
</head>

<body class="bg-light">

<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>

<div class="container py-4">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Low Stock Items</h2>

        <a class="btn btn-dark"
           th:href="@{/inventory}">
            Back to Dashboard
        </a>

    </div>

    <!-- Low Stock List -->
    <div class="card shadow-sm">

        <div class="card-header">
            <strong>Low Stock Material List</strong>
        </div>

        <div class="card-body table-responsive">

            <table class="table table-bordered align-middle">

                <thead class="table-danger">
                <tr>
                    <th>Code</th>
                    <th>Material</th>
                    <th>Current Quantity</th>
                    <th>Reorder Level</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="material : ${materials}">

                    <td th:text="${material.materialCode}"></td>

                    <td th:text="${material.materialName}"></td>

                    <td th:text="${material.currentQuantity}"></td>

                    <td th:text="${material.reorderLevel}"></td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
