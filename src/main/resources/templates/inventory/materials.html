<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Materials - LankaTex</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet" th:href="@{/css/common-navbar.css}">
</head>

<body class="bg-light">

<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>

<div class="container-fluid py-4 px-5">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Materials</h2>

        <div class="d-flex gap-2">

            <a class="btn btn-dark"
               th:href="@{/inventory}">
                Back to Dashboard
            </a>

            <a class="btn btn-primary"
               th:href="@{/inventory/materials/new}">
                Add Material
            </a>

        </div>

    </div>

    <!-- Search -->
    <form method="get"
          th:action="@{/inventory/materials}"
          class="row mb-4">

        <div class="col-md-5">

            <input class="form-control"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="Search by code or material name">

        </div>

        <div class="col">

            <button class="btn btn-dark"
                    type="submit">
                Search
            </button>

        </div>

    </form>

    <!-- Material List -->
    <div class="card shadow-sm">

        <div class="card-header">
            <strong>Material List</strong>
        </div>

        <div class="card-body table-responsive">

            <table class="table table-bordered table-striped align-middle">

                <thead class="table-dark">
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Colour</th>
                    <th>Unit</th>
                    <th>Current Qty</th>
                    <th>Reorder Level</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="material : ${materials}">

                    <td th:text="${material.materialCode}"></td>

                    <td th:text="${material.materialName}"></td>

                    <td th:text="${material.category.categoryName}"></td>

                    <td th:text="${material.colour}"></td>

                    <td th:text="${material.unit}"></td>

                    <td th:text="${material.currentQuantity}"></td>

                    <td th:text="${material.reorderLevel}"></td>

                    <td>

                        <a class="btn btn-sm btn-warning"
                           th:href="@{/inventory/materials/edit/{id}(id=${material.materialId})}">
                            Edit
                        </a>

                        <form method="post"
                              class="d-inline"
                              th:action="@{/inventory/materials/archive/{id}(id=${material.materialId})}">

                            <button class="btn btn-sm btn-danger"
                                    type="submit">
                                Archive
                            </button>

                        </form>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
