<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Materials</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container-fluid py-4 px-5">

    <!-- Page title + Add Material button -->
    <div class="d-flex justify-content-between">

        <h2>Materials</h2>

        <a class="btn btn-primary"
           th:href="@{/inventory/materials/new}">

            Add Material

        </a>

    </div>


    <!-- Success message -->
    <div th:if="${message}"
         class="alert alert-success mt-3"
         th:text="${message}">
    </div>


    <!-- Error message -->
    <div th:if="${error}"
         class="alert alert-danger mt-3"
         th:text="${error}">
    </div>


    <!-- Search -->
    <form method="get"
          th:action="@{/inventory/materials}"
          class="row mt-4">

        <div class="col-md-5">

            <input class="form-control"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="Search by code or material name">

        </div>

        <div class="col">

            <button class="btn btn-dark">
                Search
            </button>

        </div>

    </form>


    <!-- Material table -->
    <table class="table table-bordered mt-4">

        <thead class="table-dark">

        <tr>

            <th>Code</th>
            <th>Name</th>
            <th>Category</th>
            <th>Colour</th>
            <th>Unit</th>
            <th>Current Qty</th>
            <th>Reorder Level</th>
            <th>Action</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="material : ${materials}">

            <td th:text="${material.materialCode}">
            </td>

            <td th:text="${material.materialName}">
            </td>

            <td th:text="${material.category.categoryName}">
            </td>

            <td th:text="${material.colour}">
            </td>

            <td th:text="${material.unit}">
            </td>

            <td th:text="${material.currentQuantity}">
            </td>

            <td th:text="${material.reorderLevel}">
            </td>


            <td>

                <!-- UPDATE / EDIT -->
                <a class="btn btn-sm btn-warning"
                   th:href="@{/inventory/materials/edit/{id}
                   (id=${material.materialId})}">

                    Edit

                </a>


                <!-- SOFT DELETE / ARCHIVE -->
                <form method="post"
                      class="d-inline"
                      th:action="@{/inventory/materials/archive/{id}
                      (id=${material.materialId})}">

                    <button type="submit"
                            class="btn btn-sm btn-secondary"
                            onclick="return confirm('Are you sure you want to archive this material?');">

                        Archive

                    </button>

                </form>


                <!-- HARD DELETE / PERMANENT DELETE -->
                <form method="post"
                      class="d-inline"
                      th:action="@{/inventory/materials/delete/{id}
                      (id=${material.materialId})}">

                    <button type="submit"
                            class="btn btn-sm btn-danger"
                            onclick="return confirm('WARNING: This will permanently delete the material. Are you sure?');">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>


    <a th:href="@{/inventory}">
        Back to Dashboard
    </a>

</div>

</body>

</html>
