<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Materials - LankaTex
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container-fluid py-4 px-5">


    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Materials
        </h2>


        <div class="d-flex gap-2">

            <a class="btn btn-dark"
               th:href="@{/inventory}">
                Back to Dashboard
            </a>


            <a class="btn btn-primary"
               th:href="@{/inventory/materials/new}">
                Add Material
            </a>

        </div>

    </div>


    <!-- Success Message -->
    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>


    <!-- Error Message -->
    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <!-- Search -->
    <form method="get"
          th:action="@{/inventory/materials}"
          class="row mb-4">


        <div class="col-md-5">

            <input class="form-control"
                   name="keyword"
                   th:value="${keyword}"
                   placeholder="Search by code or material name">

        </div>


        <div class="col">

            <button class="btn btn-dark"
                    type="submit">
                Search
            </button>

        </div>


    </form>


    <!-- Material List -->
    <div class="card shadow-sm">


        <div class="card-header">

            <strong>
                Material List
            </strong>

        </div>


        <div class="card-body table-responsive">


            <table class="table table-bordered table-striped align-middle">


                <thead class="table-dark">

                <tr>

                    <th>Code</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Colour</th>
                    <th>Unit</th>
                    <th>Current Qty</th>
                    <th>Reorder Level</th>
                    <th>Status</th>
                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>


                <tr th:each="material : ${materials}">


                    <td th:text="${material.materialCode}">
                    </td>


                    <td th:text="${material.materialName}">
                    </td>


                    <td th:text="${material.category.categoryName}">
                    </td>


                    <td th:text="${material.colour}">
                    </td>


                    <td th:text="${material.unit}">
                    </td>


                    <td th:text="${material.currentQuantity}">
                    </td>


                    <td th:text="${material.reorderLevel}">
                    </td>


                    <!-- Material Status -->
                    <td>


                        <span th:if="${material.status == 'ACTIVE'}"
                              class="badge bg-success">
                            ACTIVE
                        </span>


                        <span th:if="${material.status == 'ARCHIVED'}"
                              class="badge bg-secondary">
                            ARCHIVED
                        </span>


                        <span th:if="${material.status != 'ACTIVE'
                                      and material.status != 'ARCHIVED'}"
                              class="badge bg-info text-dark"
                              th:text="${material.status}">
                        </span>


                    </td>


                    <!-- Actions -->
                    <td class="text-nowrap">


                        <!-- Edit -->
                        <a class="btn btn-sm btn-warning"
                           th:href="@{/inventory/materials/edit/{id}
                           (id=${material.materialId})}">
                            Edit
                        </a>


                        <!-- Archive - only ACTIVE materials -->
                        <form th:if="${material.status == 'ACTIVE'}"
                              method="post"
                              class="d-inline"
                              th:action="@{/inventory/materials/archive/{id}
                              (id=${material.materialId})}">

                            <button type="submit"
                                    class="btn btn-sm btn-secondary"
                                    onclick="return confirm('Are you sure you want to archive this material?');">
                                Archive
                            </button>

                        </form>


                        <!-- Restore - only ARCHIVED materials -->
                        <form th:if="${material.status == 'ARCHIVED'}"
                              method="post"
                              class="d-inline"
                              th:action="@{/inventory/materials/restore/{id}
                              (id=${material.materialId})}">

                            <button type="submit"
                                    class="btn btn-sm btn-success"
                                    onclick="return confirm('Restore this material back to ACTIVE status?');">
                                Restore
                            </button>

                        </form>


                        <!-- Permanent Delete -->
                        <form method="post"
                              class="d-inline"
                              th:action="@{/inventory/materials/delete/{id}
                              (id=${material.materialId})}">

                            <button type="submit"
                                    class="btn btn-sm btn-danger"
                                    onclick="return confirm('WARNING: This will permanently delete the material. Are you sure?');">
                                Delete
                            </button>

                        </form>


                    </td>


                </tr>


                </tbody>


            </table>


        </div>


    </div>


</div>


</body>

</html>
