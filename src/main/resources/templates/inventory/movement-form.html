<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stock Movement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container py-4">

    <h2>Stock Movement</h2>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <form method="post"
          th:action="@{/inventory/movements/save}"
          th:object="${movement}">

        <div class="mb-3">

            <label>Batch</label>

            <select class="form-select"
                    name="batchId">

                <option th:each="batch : ${batches}"
                        th:value="${batch.batchId}"
                        th:text="${batch.batchNo
                        + ' - '
                        + batch.material.materialName
                        + ' (Available: '
                        + batch.availableQty
                        + ')'}">
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label>Movement Type</label>

            <select class="form-select"
                    th:field="*{movementType}">

                <option th:each="type : ${movementTypes}"
                        th:value="${type}"
                        th:text="${type}">
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label>Quantity</label>

            <input type="number"
                   step="0.01"
                   min="0.01"
                   class="form-control"
                   th:field="*{quantity}">

        </div>

        <div class="mb-3">

            <label>Reference Type</label>

            <input class="form-control"
                   th:field="*{referenceType}"
                   placeholder="PRODUCTION_PLAN / RETURN">

        </div>

        <div class="mb-3">

            <label>Reference ID</label>

            <input type="number"
                   class="form-control"
                   th:field="*{referenceId}">

        </div>

        <button class="btn btn-success">
            Save Movement
        </button>

    </form>

</div>

</body>
</html>
