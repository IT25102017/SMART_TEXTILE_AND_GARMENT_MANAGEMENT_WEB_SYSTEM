<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">
        LankaTex - Inventory Management
    </span>
</nav>

<div class="container py-4">

    <h2>Inventory Dashboard</h2>

    <div class="row mt-4">

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Total Materials</h5>
                    <h2 th:text="${#lists.size(materials)}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Low Stock Items</h5>
                    <h2 th:text="${#lists.size(lowStock)}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Stock Movements</h5>
                    <h2 th:text="${#lists.size(movements)}">0</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="mt-4 d-flex flex-wrap gap-2">

        <a class="btn btn-primary"
           th:href="@{/inventory/materials}">
            Materials
        </a>

        <a class="btn btn-secondary"
           th:href="@{/inventory/categories}">
            Categories
        </a>

        <a class="btn btn-success"
           th:href="@{/inventory/batches}">
            Material Batches
        </a>

        <a class="btn btn-warning"
           th:href="@{/inventory/movements}">
            Stock Movements
        </a>

        <a class="btn btn-info"
           th:href="@{/inventory/receipts}">
            Goods Receipts
        </a>

        <a class="btn btn-dark"
           th:href="@{/inventory/adjustments}">
            Stock Adjustments
        </a>

        <a class="btn btn-danger"
           th:href="@{/inventory/materials/low-stock}">
            Low Stock
        </a>

    </div>

</div>
</body>
</html>
