<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quality Control, Wastage and Rejected Item Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Quality Control, Wastage and Rejected Item Management</h2>
        <a class="btn btn-dark btn-sm" th:href="@{/quality}">Dashboard</a>
    </div>
    <div class="mb-3">
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/quality/inspections}">Quality Inspection</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/quality/defects}">Defect Record</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/quality/wastage}">Wastage Record</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/quality/holds}">Quality Hold</a>
    </div>
    <div class="row">
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Quality Inspection</h6>
                <h2 th:text="${stats.qualityInspectionCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/quality/inspections}">Open</a>
            </div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Defect Record</h6>
                <h2 th:text="${stats.defectRecordCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/quality/defects}">Open</a>
            </div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Wastage Record</h6>
                <h2 th:text="${stats.wastageRecordCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/quality/wastage}">Open</a>
            </div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Quality Hold</h6>
                <h2 th:text="${stats.qualityHoldCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/quality/holds}">Open</a>
            </div></div>
        </div>
    </div>
</div>
</body>
</html>
