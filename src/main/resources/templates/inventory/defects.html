<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Defect Record - Quality Control, Wastage and Rejected Item Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Quality Control, Wastage and Rejected Item Management</h2>
        <a class="btn btn-dark btn-sm" th:href="@{/quality}">Dashboard</a>
    </div>
    <div class="mb-3">
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/quality/inspections}">Quality Inspection</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/quality/defects}">Defect Record</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/quality/wastage}">Wastage Record</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/quality/holds}">Quality Hold</a>
    </div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="card shadow-sm mb-4">
        <div class="card-header"><strong>Add / Edit Defect Record</strong></div>
        <div class="card-body">
            <form th:action="@{/quality/defects/save}" th:object="${defectRecord}" method="post">
                <input type="hidden" th:field="*{defectId}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Inspection ID</label>
                        <input class="form-control" type="number" th:field="*{inspectionId}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Defect Type</label>
                        <input class="form-control" type="text" th:field="*{defectType}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Severity</label>
                        <input class="form-control" type="text" th:field="*{severity}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Quantity</label>
                        <input class="form-control" type="number" th:field="*{quantity}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Responsible Department ID</label>
                        <input class="form-control" type="number" th:field="*{responsibleDepartmentId}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Remarks</label>
                        <input class="form-control" type="text" th:field="*{remarks}">
                    </div>
                </div>
                <button class="btn btn-success" type="submit">Save</button>
                <a class="btn btn-secondary" th:href="@{/quality/defects}">Clear</a>
            </form>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="card-header"><strong>Defect Record List</strong></div>
        <div class="card-body table-responsive">
            <table class="table table-striped table-bordered align-middle">
                <thead class="table-dark"><tr><th>ID</th><th>Inspection ID</th><th>Defect
                    Type</th><th>Severity</th><th>Quantity</th><th>Responsible Department ID</th><th>Remarks</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="row : ${defectsList}">
                    <td th:text="${row.defectId}"></td><td th:text="${row.inspectionId}"></td><td
                        th:text="${row.defectType}"></td><td th:text="${row.severity}"></td><td th:text="${row.quantity}"></td><td
                        th:text="${row.responsibleDepartmentId}"></td><td th:text="${row.remarks}"></td>
                    <td class="text-nowrap"><a class="btn btn-warning btn-sm"
                                               th:href="@{/quality/defects(editId=${row.defectId})}">Edit</a> <a class="btn btn-outline-danger btn-sm"
                                                                                                                 th:href="@{/quality/defects/delete/{id}(id=${row.defectId})}" onclick="return confirm('Delete this record?')">Delete</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
