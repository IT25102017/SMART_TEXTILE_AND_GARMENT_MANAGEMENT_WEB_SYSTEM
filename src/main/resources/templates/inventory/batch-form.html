<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Receive Material</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container py-4">

    <h2>Receive Material Batch</h2>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <form method="post"
          th:action="@{/inventory/batches/save}"
          th:object="${batch}">

        <div class="mb-3">

            <label>Material</label>

            <select class="form-select"
                    name="materialId"
                    required>

                <option th:each="material : ${materials}"
                        th:value="${material.materialId}"
                        th:text="${material.materialCode
                        + ' - '
                        + material.materialName}">
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label>Supplier ID</label>

            <input type="number"
                   class="form-control"
                   th:field="*{supplierId}">

        </div>

        <div class="mb-3">

            <label>Batch Number</label>

            <input class="form-control"
                   th:field="*{batchNo}">

        </div>

        <div class="mb-3">

            <label>Received Date</label>

            <input type="date"
                   class="form-control"
                   th:field="*{receivedDate}">

        </div>

        <div class="mb-3">

            <label>Unit Cost</label>

            <input type="number"
                   step="0.01"
                   min="0"
                   class="form-control"
                   th:field="*{unitCost}">

        </div>

        <div class="mb-3">

            <label>Received Quantity</label>

            <input type="number"
                   step="0.01"
                   min="0.01"
                   class="form-control"
                   th:field="*{availableQty}">

        </div>

        <div class="mb-3">

            <label>Location</label>

            <input class="form-control"
                   th:field="*{location}">

        </div>

        <button class="btn btn-success">
            Save Receipt
        </button>

    </form>

</div>

</body>
</html>
