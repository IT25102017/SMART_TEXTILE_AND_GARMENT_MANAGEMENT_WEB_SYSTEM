<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:text="${isEdit}
                    ? 'Edit Material Batch | LankaTex'
                    : 'Receive Material Batch | LankaTex'">
        Material Batch | LankaTex
    </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container py-5">


    <div class="card shadow-sm border-0">

        <div class="card-body p-4">


            <h2 class="mb-4"
                th:text="${isEdit}
                         ? 'Edit Material Batch'
                         : 'Receive Material Batch'">
                Material Batch
            </h2>


            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>


            <form method="post"
                  th:action="@{/inventory/batches/save}"
                  th:object="${batch}">


                <!-- Batch ID for Update -->

                <input type="hidden"
                       th:field="*{batchId}">


                <!-- Material -->

                <div class="mb-3">

                    <label class="form-label">
                        Material
                    </label>


                    <!-- Create Mode -->

                    <select th:if="${!isEdit}"
                            class="form-select"
                            name="materialId"
                            required>

                        <option value=""
                                disabled
                                selected>
                            Select Material
                        </option>


                        <option th:each="material : ${materials}"
                                th:value="${material.materialId}"
                                th:text="${material.materialCode
                                + ' - '
                                + material.materialName}">
                        </option>

                    </select>


                    <!-- Edit Mode -->

                    <input th:if="${isEdit}"
                           type="text"
                           class="form-control"
                           th:value="${batch.material.materialCode
                           + ' - '
                           + batch.material.materialName}"
                           readonly>


                    <input th:if="${isEdit}"
                           type="hidden"
                           name="materialId"
                           th:value="${batch.material.materialId}">


                    <small th:if="${isEdit}"
                           class="text-muted">
                        Material cannot be changed after the batch is received.
                    </small>

                </div>



                <!-- Supplier ID -->

                <div class="mb-3">

                    <label class="form-label">
                        Supplier ID
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{supplierId}">

                </div>



                <!-- Batch Number -->

                <div class="mb-3">

                    <label class="form-label">
                        Batch Number
                    </label>

                    <input class="form-control"
                           th:field="*{batchNo}"
                           required>

                </div>



                <!-- Received Date -->

                <div class="mb-3">

                    <label class="form-label">
                        Received Date
                    </label>

                    <input type="date"
                           class="form-control"
                           th:field="*{receivedDate}"
                           required>

                </div>



                <!-- Unit Cost -->

                <div class="mb-3">

                    <label class="form-label">
                        Unit Cost
                    </label>

                    <input type="number"
                           step="0.01"
                           min="0"
                           class="form-control"
                           th:field="*{unitCost}">

                </div>



                <!-- Quantity -->

                <div class="mb-3">

                    <label class="form-label">
                        Received Quantity
                    </label>

                    <input type="number"
                           step="0.01"
                           min="0.01"
                           class="form-control"
                           th:field="*{availableQty}"
                           th:readonly="${isEdit}"
                           required>


                    <small th:if="${isEdit}"
                           class="text-muted">
                        Quantity cannot be edited because stock transactions
                        already depend on this value.
                    </small>

                </div>



                <!-- Location -->

                <div class="mb-4">

                    <label class="form-label">
                        Location
                    </label>

                    <input class="form-control"
                           th:field="*{location}">

                </div>



                <div class="d-flex gap-2">


                    <button type="submit"
                            class="btn btn-success"
                            th:text="${isEdit}
                                     ? 'Update Batch'
                                     : 'Save Receipt'">
                        Save
                    </button>


                    <a class="btn btn-secondary"
                       th:href="@{/inventory/batches}">
                        Cancel
                    </a>


                </div>


            </form>


        </div>

    </div>


</div>


</body>

</html>
