<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Production Planning and Material Issue Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Production Planning and Material Issue Management</h2>
        <a class="btn btn-dark btn-sm" th:href="@{/production}">Dashboard</a>
    </div>
    <div class="mb-3">
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/production/plans}">Production Plan</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/production/requests}">Material Request</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/production/issues}">Material Issue Note</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/production/progress}">Production Progress</a>
    </div>
    <div class="row">
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Production Plan</h6>
                <h2 th:text="${stats.productionPlanCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/production/plans}">Open</a>
            </div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Material Request</h6>
                <h2 th:text="${stats.materialRequestCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/production/requests}">Open</a>
            </div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Material Issue Note</h6>
                <h2 th:text="${stats.materialIssueNoteCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/production/issues}">Open</a>
            </div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Production Progress</h6>
                <h2 th:text="${stats.productionProgressCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/production/progress}">Open</a>
            </div></div>
        </div>
    </div>
</div>
</body>
</html>
