<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Production Plans | LankaTex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common-navbar.css}">
    <link rel="stylesheet" th:href="@{/css/production/production-ui.css}">
</head>
<body class="production-page">
<div th:replace="~{fragments/common-navbar :: navbar}"></div>
<main class="production-container">
    <section class="production-hero"><span class="production-eyebrow">LankaTex Production</span><h1>Production Plans</h1><p>Create production schedules only for approved customer orders.</p></section>
    <nav class="production-nav"><a th:href="@{/production}">Dashboard</a><a th:href="@{/production/requests}">Material Requests</a><a th:href="@{/production/issues}">Material Issues</a><a th:href="@{/production/progress}">Progress</a></nav>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <section class="production-panel">
        <h2 th:text="${productionPlan.planId == null ? 'New Production Plan' : 'Edit Production Plan'}">New Production Plan</h2>
        <form th:action="@{/production/plans/save}" th:object="${productionPlan}" method="post">
            <input type="hidden" th:field="*{planId}">
            <div class="production-form-grid">
                <div><label class="form-label">Approved Customer Order</label><select class="form-select" th:field="*{orderId}" required><option value="">Select Order</option><option th:each="order : ${orders}" th:value="${order.orderId}" th:text="${'ORD-' + #numbers.formatInteger(order.orderId,3) + ' | ' + order.requiredDeliveryDate + ' | ' + order.priority}"></option></select></div>
                <div><label class="form-label">Supervisor</label><select class="form-select" th:field="*{supervisorId}"><option value="">No Supervisor</option><option th:each="employee : ${employees}" th:value="${employee.employeeId}" th:text="${employee.employeeCode + ' - ' + employee.fullName}"></option></select></div>
                <div><label class="form-label">Planned Quantity</label><input class="form-control" type="number" step="0.01" min="0.01" th:field="*{plannedQty}" required></div>
                <div><label class="form-label">Production Line</label><input class="form-control" th:field="*{productionLine}" placeholder="Example: Line A" required></div>
                <div><label class="form-label">Start Date</label><input class="form-control" type="date" th:field="*{startDate}" required></div>
                <div><label class="form-label">End Date</label><input class="form-control" type="date" th:field="*{endDate}" required></div>
            </div>
            <div class="mt-3 d-flex gap-2"><button class="production-button production-button-primary" type="submit">Save Plan</button><a class="production-button production-button-secondary" th:href="@{/production/plans}">Clear</a></div>
        </form>
    </section>

    <section class="production-panel">
        <h2>Production Plan List</h2>
        <div class="production-table-wrap"><table class="production-table">
            <thead><tr><th>Plan</th><th>Order</th><th>Qty</th><th>Dates</th><th>Line</th><th>Supervisor</th><th>Completion</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="row : ${plansList}" th:with="order=${orderMap.get(row.orderId)}, supervisor=${row.supervisorId != null ? employeeMap.get(row.supervisorId) : null}" th:classappend="${row.status == 'ARCHIVED' ? 'production-row-archived' : ''}">
                <td><strong th:text="${row.planCode}">PP-001</strong></td>
                <td th:text="${order != null ? 'ORD-' + #numbers.formatInteger(order.orderId,3) : 'Order unavailable'}"></td>
                <td th:text="${row.plannedQty}"></td><td th:text="${row.startDate + ' to ' + row.endDate}"></td><td th:text="${row.productionLine}"></td>
                <td th:text="${supervisor != null ? supervisor.employeeCode + ' - ' + supervisor.fullName : '-'}"></td>
                <td th:text="${completionMap.get(row.planId) + '%'}"></td>
                <td><span class="production-status" th:classappend="${row.status == 'APPROVED' ? ' status-approved' : row.status == 'IN_PROGRESS' ? ' status-progress' : row.status == 'COMPLETED' ? ' status-completed' : row.status == 'REJECTED' ? ' status-rejected' : row.status == 'ARCHIVED' ? ' status-archived' : ' status-pending'}" th:text="${row.status}"></span></td>
                <td><div class="production-actions">
                    <a th:if="${row.status == 'PENDING' or row.status == 'REJECTED'}" class="production-button production-button-warning" th:href="@{/production/plans(editId=${row.planId})}">Edit</a>
                    <form th:if="${row.status == 'PENDING'}" method="post" th:action="@{/production/plans/approve/{id}(id=${row.planId})}"><button class="production-button production-button-success" type="submit">Approve</button></form>
                    <form th:if="${row.status == 'PENDING'}" method="post" th:action="@{/production/plans/reject/{id}(id=${row.planId})}"><button class="production-button production-button-danger" type="submit">Reject</button></form>
                    <form th:if="${row.status != 'ARCHIVED'}" method="post" th:action="@{/production/plans/archive/{id}(id=${row.planId})}"><button class="production-button production-button-secondary" type="submit">Archive</button></form>
                    <form th:if="${row.status == 'ARCHIVED'}" method="post" th:action="@{/production/plans/restore/{id}(id=${row.planId})}"><button class="production-button production-button-success" type="submit">Restore</button></form>
                    <form method="post" th:action="@{/production/plans/delete/{id}(id=${row.planId})}" onsubmit="return confirm('Permanently delete this plan?');"><button class="production-button production-button-danger" type="submit">Delete</button></form>
                </div></td>
            </tr>
            <tr th:if="${#lists.isEmpty(plansList)}"><td colspan="9">No Production Plans found.</td></tr>
            </tbody>
        </table></div>
    </section>
</main>
</body>
</html>
