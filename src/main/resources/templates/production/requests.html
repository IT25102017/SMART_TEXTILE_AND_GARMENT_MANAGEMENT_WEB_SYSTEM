<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Material Request - LankaTex
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container py-4">


    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Material Request Management
        </h2>

        <a class="btn btn-dark"
           th:href="@{/production}">
            Back to Dashboard
        </a>

    </div>


    <!-- Production Module Navigation -->
    <div class="mb-3">

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/production/plans}">
            Production Plan
        </a>

        <a class="btn btn-primary btn-sm me-2 mb-2"
           th:href="@{/production/requests}">
            Material Request
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/production/issues}">
            Material Issue Note
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/production/progress}">
            Production Progress
        </a>

    </div>


    <!-- Success Message -->
    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>


    <!-- Error Message -->
    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <!-- Material Request Form -->
    <div class="card shadow-sm mb-4">

        <div class="card-header">

            <strong>
                Add / Edit Material Request
            </strong>

        </div>


        <div class="card-body">

            <form th:action="@{/production/requests/save}"
                  th:object="${materialRequest}"
                  method="post">


                <input type="hidden"
                       th:field="*{materialRequestId}">


                <div class="row">


                    <!-- Production Plan ID -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Production Plan ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{planId}"
                               required>

                    </div>


                    <!-- Requested By -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Requested By User ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{requestedBy}"
                               required>

                    </div>


                    <!-- Request Date -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Request Date
                        </label>

                        <input class="form-control"
                               type="date"
                               th:field="*{requestDate}"
                               required>

                    </div>


                    <!-- Status -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{status}">

                    </div>


                    <!-- Approved By -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Approved By User ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{approvedBy}">

                    </div>


                </div>


                <button class="btn btn-success"
                        type="submit">
                    Save
                </button>


                <a class="btn btn-secondary"
                   th:href="@{/production/requests}">
                    Clear
                </a>


            </form>

        </div>

    </div>


    <!-- Material Request List -->
    <div class="card shadow-sm">

        <div class="card-header">

            <strong>
                Material Request List
            </strong>

        </div>


        <div class="card-body table-responsive">

            <table class="table table-striped table-bordered align-middle">


                <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Production Plan ID</th>
                    <th>Requested By User ID</th>
                    <th>Request Date</th>
                    <th>Status</th>
                    <th>Approved By User ID</th>
                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>


                <tr th:each="row : ${requestsList}">


                    <td th:text="${row.materialRequestId}">
                    </td>


                    <td th:text="${row.planId}">
                    </td>


                    <td th:text="${row.requestedBy}">
                    </td>


                    <td th:text="${row.requestDate}">
                    </td>


                    <td th:text="${row.status}">
                    </td>


                    <td th:text="${row.approvedBy}">
                    </td>


                    <!-- Actions -->
                    <td class="text-nowrap">


                        <!-- Edit -->
                        <a class="btn btn-warning btn-sm"
                           th:href="@{/production/requests(editId=${row.materialRequestId})}">
                            Edit
                        </a>


                        <!-- Archive -->
                        <a class="btn btn-outline-secondary btn-sm"
                           th:href="@{/production/requests/archive/{id}(id=${row.materialRequestId})}"
                           onclick="return confirm('Archive this Material Request?');">
                            Archive
                        </a>


                        <!-- Delete -->
                        <a class="btn btn-danger btn-sm"
                           th:href="@{/production/requests/delete/{id}(id=${row.materialRequestId})}"
                           onclick="return confirm('WARNING: Permanently delete this Material Request?');">
                            Delete
                        </a>


                    </td>


                </tr>


                </tbody>


            </table>

        </div>

    </div>


</div>


</body>

</html>
