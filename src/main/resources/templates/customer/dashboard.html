<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Order and Delivery Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Customer Order and Delivery Management</h2>
        <a class="btn btn-primary  btn-sm" th:href="@{/customer}">DASHBOARD</a>
    </div>
    <div class="mb-3">
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/customer/customers}">Customer</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/customer/quotations}">Quotation</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/customer/orders}">Customer Order</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/customer/deliverys}">Delivery</a>
    </div>
    <div class="row">
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Customer</h6>
                <h2 th:text="${stats.customerCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/customer/customers}">Open</a>
            </div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Quotation</h6>
                <h2 th:text="${stats.quotationCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/customer/quotations}">Open</a>
            </div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Customer Order</h6>
                <h2 th:text="${stats.customerOrderCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/customer/orders}">Open</a>
            </div></div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card shadow-sm h-100"><div class="card-body">
                <h6 class="text-muted">Delivery</h6>
                <h2 th:text="${stats.deliveryCount}">0</h2>
                <a class="btn btn-primary btn-sm" th:href="@{/customer/deliverys}">Open</a>
            </div></div>
        </div>
    </div>
</div>
</body>
</html>
