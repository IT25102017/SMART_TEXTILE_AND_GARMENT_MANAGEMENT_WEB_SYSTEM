<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Customer Management - LankaTex
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container py-4">


    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Customer Management
        </h2>

        <a class="btn btn-dark"
           th:href="@{/customer}">
            Back to Dashboard
        </a>

    </div>


    <!-- Customer Module Navigation -->
    <div class="mb-3">

        <a class="btn btn-primary btn-sm me-2 mb-2"
           th:href="@{/customer/customers}">
            Customer
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/customer/quotations}">
            Quotation
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/customer/orders}">
            Customer Order
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/customer/deliverys}">
            Delivery
        </a>

    </div>


    <!-- Success Message -->
    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>


    <!-- Error Message -->
    <div th:if="${error}"
         class="alert alert-danger">

        <strong>Validation Error: </strong>

        <span th:text="${error}"></span>

    </div>


    <!-- Customer Form -->
    <div class="card shadow-sm mb-4">

        <div class="card-header">

            <strong>
                Add / Edit Customer
            </strong>

        </div>


        <div class="card-body">

            <form th:action="@{/customer/customers/save}"
                  th:object="${customer}"
                  method="post">


                <input type="hidden"
                       th:field="*{customerId}">


                <div class="row">


                    <!-- Customer Name -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Customer Name
                            <span class="text-danger">*</span>
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{customerName}"
                               minlength="2"
                               maxlength="100"
                               placeholder="e.g. Acme Garments Ltd"
                               required>

                    </div>


                    <!-- Customer Type -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Customer Type
                            <span class="text-danger">*</span>
                        </label>

                        <select class="form-select"
                                th:field="*{customerType}"
                                required>

                            <option value="">
                                -- Select Customer Type --
                            </option>

                            <option value="Retail">
                                Retail
                            </option>

                            <option value="Wholesale">
                                Wholesale
                            </option>

                            <option value="Corporate">
                                Corporate
                            </option>

                            <option value="Export">
                                Export
                            </option>

                        </select>

                    </div>


                    <!-- Contact Person -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Contact Person
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{contactPerson}"
                               maxlength="100"
                               placeholder="e.g. John Doe">

                    </div>


                    <!-- Phone -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                            <span class="text-danger">*</span>
                        </label>

                        <input class="form-control"
                               type="tel"
                               th:field="*{phone}"
                               pattern="^(\+?[0-9]{1,4}[\s-]?)?[0-9]{9,12}$"
                               title="Enter a valid 9-12 digit phone number"
                               placeholder="e.g. 0771234567"
                               required>

                    </div>


                    <!-- Email -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                            <span class="text-danger">*</span>
                        </label>

                        <input class="form-control"
                               type="email"
                               th:field="*{email}"
                               maxlength="100"
                               placeholder="e.g. contact@example.com"
                               required>

                    </div>


                    <!-- Billing Address -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Billing Address
                            <span class="text-danger">*</span>
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{billingAddress}"
                               minlength="5"
                               maxlength="1000"
                               placeholder="e.g. 123 Main Street, Colombo"
                               required>

                    </div>


                    <!-- Delivery Address -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Delivery Address
                            <span class="text-danger">*</span>
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{deliveryAddress}"
                               minlength="5"
                               maxlength="1000"
                               placeholder="e.g. 456 Industrial Zone, Biyagama"
                               required>

                    </div>


                </div>


                <button class="btn btn-success"
                        type="submit">
                    Save
                </button>


                <a class="btn btn-secondary"
                   th:href="@{/customer/customers}">
                    Clear
                </a>


            </form>

        </div>

    </div>


    <!-- Customer List -->
    <div class="card shadow-sm">

        <div class="card-header">

            <strong>
                Customer List
            </strong>

        </div>


        <div class="card-body table-responsive">

            <table class="table table-striped table-bordered align-middle">


                <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Customer Name</th>
                    <th>Customer Type</th>
                    <th>Contact Person</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Billing Address</th>
                    <th>Delivery Address</th>
                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>


                <tr th:each="row : ${customersList}">


                    <td th:text="${row.customerId}">
                    </td>


                    <td th:text="${row.customerName}">
                    </td>


                    <td th:text="${row.customerType}">
                    </td>


                    <td th:text="${row.contactPerson}">
                    </td>


                    <td th:text="${row.phone}">
                    </td>


                    <td th:text="${row.email}">
                    </td>


                    <td th:text="${row.billingAddress}">
                    </td>


                    <td th:text="${row.deliveryAddress}">
                    </td>


                    <!-- Actions -->
                    <td class="text-nowrap">


                        <!-- Edit -->
                        <a class="btn btn-warning btn-sm"
                           th:href="@{/customer/customers(editId=${row.customerId})}">
                            Edit
                        </a>


                        <!-- Delete -->
                        <a class="btn btn-danger btn-sm"
                           th:href="@{/customer/customers/delete/{id}(id=${row.customerId})}"
                           onclick="return confirm('Delete this customer?');">
                            Delete
                        </a>


                    </td>


                </tr>


                </tbody>


            </table>

        </div>

    </div>


</div>


</body>

</html>
