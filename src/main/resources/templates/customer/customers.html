<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customers | LankaTex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common-navbar.css}">
    <link rel="stylesheet" th:href="@{/css/customer/customer-ui.css}">
</head>
<body class="customer-page">
<div th:replace="~{fragments/common-navbar :: navbar}"></div>
<main class="customer-shell">
    <section class="customer-hero">
        <span class="customer-eyebrow">Customer Relations</span>
        <h1>Customers</h1>
        <p class="mb-0">Create and maintain active customer profiles.</p>
    </section>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <section class="customer-panel">
        <div class="customer-toolbar">
            <div class="customer-nav">
                <a th:href="@{/customer}">Dashboard</a>
                <a th:href="@{/customer/quotations}">Quotations</a>
                <a th:href="@{/customer/orders}">Orders</a>
                <a th:href="@{/customer/deliveries}">Deliveries</a>
            </div>
        </div>
        <form th:action="@{/customer/customers/save}" th:object="${customer}" method="post">
            <input type="hidden" th:field="*{customerId}">
            <div class="form-section row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Customer Name</label>
                    <input class="form-control" th:field="*{customerName}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Customer Type</label>
                    <select class="form-select" th:field="*{customerType}" required>
                        <option value="LOCAL">LOCAL</option>
                        <option value="EXPORT">EXPORT</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Contact Person</label>
                    <input class="form-control" th:field="*{contactPerson}">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Phone</label>
                    <input class="form-control" th:field="*{phone}">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{email}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Billing Address</label>
                    <textarea class="form-control" rows="2" th:field="*{billingAddress}"></textarea>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Delivery Address</label>
                    <textarea class="form-control" rows="2" th:field="*{deliveryAddress}"></textarea>
                </div>
                <input type="hidden" th:field="*{status}">
            </div>
            <button class="customer-btn btn-main" type="submit" th:text="${customer.customerId == null ? 'Save Customer' : 'Update Customer'}"></button>
            <a class="customer-btn btn-muted" th:href="@{/customer/customers}">Clear</a>
        </form>
    </section>

    <section class="customer-panel">
        <div class="table-responsive">
            <table class="customer-table">
                <thead>
                <tr>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Contact</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${customersList}">
                    <td class="code-pill" th:text="${c.customerCode}"></td>
                    <td th:text="${c.customerName}"></td>
                    <td th:text="${c.customerType}"></td>
                    <td>
                        <span th:text="${c.phone}"></span><br>
                        <small th:text="${c.email}"></small>
                    </td>
                    <td>
                        <span class="status-pill" th:text="${c.status}"></span>
                    </td>
                    <td>
                        <a class="customer-btn btn-edit" th:href="@{/customer/customers(editId=${c.customerId})}">Edit</a>
                        <form class="d-inline" th:if="${c.status != 'ARCHIVED'}" method="post" th:action="@{/customer/customers/archive/{id}(id=${c.customerId})}">
                            <button class="customer-btn btn-reject" type="submit">Archive</button>
                        </form>
                        <form class="d-inline" th:if="${c.status == 'ARCHIVED'}" method="post" th:action="@{/customer/customers/restore/{id}(id=${c.customerId})}">
                            <button class="customer-btn btn-approve" type="submit">Restore</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
