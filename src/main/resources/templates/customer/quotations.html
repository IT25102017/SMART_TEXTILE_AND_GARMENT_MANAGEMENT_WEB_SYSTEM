<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Quotation Management - LankaTex
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container py-4">


    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Quotation Management
        </h2>

        <a class="btn btn-dark"
           th:href="@{/customer}">
            Back to Dashboard
        </a>

    </div>


    <!-- Customer Module Navigation -->
    <div class="mb-3">

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/customer/customers}">
            Customer
        </a>

        <a class="btn btn-primary btn-sm me-2 mb-2"
           th:href="@{/customer/quotations}">
            Quotation
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/customer/orders}">
            Customer Order
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/customer/deliverys}">
            Delivery
        </a>

    </div>


    <!-- Success Message -->
    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>


    <!-- Error Message -->
    <div th:if="${error}"
         class="alert alert-danger">

        <strong>
            Validation Error:
        </strong>

        <span th:text="${error}">
        </span>

    </div>


    <!-- Quotation Form -->
    <div class="card shadow-sm mb-4">

        <div class="card-header">

            <strong>
                Add / Edit Quotation
            </strong>

        </div>


        <div class="card-body">

            <form th:action="@{/customer/quotations/save}"
                  th:object="${quotation}"
                  method="post">


                <input type="hidden"
                       th:field="*{quotationId}">


                <div class="row">


                    <!-- Customer ID -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Customer ID
                            <span class="text-danger">*</span>
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{customerId}"
                               min="1"
                               placeholder="e.g. 1"
                               required>

                    </div>


                    <!-- Quotation Date -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Quotation Date
                            <span class="text-danger">*</span>
                        </label>

                        <input class="form-control"
                               type="date"
                               th:field="*{quotationDate}"
                               required>

                    </div>


                    <!-- Valid Until -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Valid Until
                            <span class="text-danger">*</span>
                        </label>

                        <input class="form-control"
                               type="date"
                               th:field="*{validUntil}"
                               required>

                    </div>


                    <!-- Status -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select class="form-select"
                                th:field="*{status}">

                            <option value="Pending">
                                Pending
                            </option>

                            <option value="Approved">
                                Approved
                            </option>

                            <option value="Rejected">
                                Rejected
                            </option>

                            <option value="Archived">
                                Archived
                            </option>

                        </select>

                    </div>


                    <!-- Approved By -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Approved By User ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{approvedBy}"
                               min="1"
                               placeholder="User ID (optional)">

                    </div>


                    <!-- Total Value -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Total Value (LKR)
                            <span class="text-danger">*</span>
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{totalValue}"
                               min="0.01"
                               step="0.01"
                               placeholder="e.g. 150000.00"
                               required>

                    </div>


                </div>


                <button class="btn btn-success"
                        type="submit">
                    Save
                </button>


                <a class="btn btn-secondary"
                   th:href="@{/customer/quotations}">
                    Clear
                </a>


            </form>

        </div>

    </div>


    <!-- Quotation List -->
    <div class="card shadow-sm">

        <div class="card-header">

            <strong>
                Quotation List
            </strong>

        </div>


        <div class="card-body table-responsive">

            <table class="table table-striped table-bordered align-middle">


                <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Customer ID</th>
                    <th>Quotation Date</th>
                    <th>Valid Until</th>
                    <th>Status</th>
                    <th>Approved By</th>
                    <th>Total Value</th>
                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>


                <tr th:each="row : ${quotationsList}">


                    <td th:text="${row.quotationId}">
                    </td>


                    <td th:text="${row.customerId}">
                    </td>


                    <td th:text="${row.quotationDate}">
                    </td>


                    <td th:text="${row.validUntil}">
                    </td>


                    <!-- Status -->
                    <td>

                        <span class="badge"
                              th:classappend="${
                                  row.status == 'Approved'
                                  ? 'bg-success'
                                  : (
                                      row.status == 'Rejected'
                                      ? 'bg-danger'
                                      : (
                                          row.status == 'Archived'
                                          ? 'bg-secondary'
                                          : 'bg-warning text-dark'
                                      )
                                  )
                              }"
                              th:text="${row.status}">
                        </span>

                    </td>


                    <td th:text="${row.approvedBy}">
                    </td>


                    <td th:text="${row.totalValue}">
                    </td>


                    <!-- Actions -->
                    <td class="text-nowrap">


                        <!-- Edit -->
                        <a class="btn btn-warning btn-sm"
                           th:href="@{/customer/quotations(editId=${row.quotationId})}">
                            Edit
                        </a>


                        <!-- Delete -->
                        <a class="btn btn-danger btn-sm"
                           th:href="@{/customer/quotations/delete/{id}(id=${row.quotationId})}"
                           onclick="return confirm('Delete this quotation?');">
                            Delete
                        </a>


                    </td>


                </tr>


                </tbody>


            </table>

        </div>

    </div>


</div>


</body>

</html>
