<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quotations | LankaTex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common-navbar.css}">
    <link rel="stylesheet" th:href="@{/css/customer/customer-ui.css}">
</head>
<body class="customer-page">
<div th:replace="~{fragments/common-navbar :: navbar}"></div>
<main class="customer-shell">
    <section class="customer-hero">
        <span class="customer-eyebrow">Customer Relations</span>
        <h1>Quotations</h1>
        <p class="mb-0">Prepare garment quotations and convert approved quotations into orders.</p>
    </section>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <section class="customer-panel">
        <div class="customer-nav mb-3">
            <a th:href="@{/customer}">Dashboard</a>
            <a th:href="@{/customer/customers}">Customers</a>
            <a th:href="@{/customer/orders}">Orders</a>
            <a th:href="@{/customer/deliveries}">Deliveries</a>
        </div>
        <form th:action="@{/customer/quotations/save}" th:object="${quotation}" method="post">
            <input type="hidden" th:field="*{quotationId}">
            <input type="hidden" th:field="*{status}">
            <div class="form-section row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Customer</label>
                    <select class="form-select" th:field="*{customerId}" required>
                        <option value="">Select Customer</option>
                        <option th:each="c:${customers}" th:value="${c.customerId}" th:text="${c.customerCode + ' - ' + c.customerName}"></option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Quotation Date</label>
                    <input type="date" class="form-control" th:field="*{quotationDate}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Valid Until</label>
                    <input type="date" class="form-control" th:field="*{validUntil}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Garment Type</label>
                    <input class="form-control" th:field="*{garmentType}" required>
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label">Colour</label>
                    <input class="form-control" th:field="*{colour}">
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label">Size</label>
                    <input class="form-control" th:field="*{size}">
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" min="0.01" step="0.01" class="form-control" th:field="*{quantity}" required>
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label">Unit Price</label>
                    <input type="number" min="0" step="0.01" class="form-control" th:field="*{unitPrice}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Requested Delivery Date</label>
                    <input type="date" class="form-control" th:field="*{requestedDeliveryDate}" required>
                </div>
            </div>
            <button class="customer-btn btn-main" type="submit">Save Quotation</button>
            <a class="customer-btn btn-muted" th:href="@{/customer/quotations}">Clear</a>
        </form>
    </section>

    <section class="customer-panel">
        <div class="table-responsive">
            <table class="customer-table">
                <thead>
                <tr>
                    <th>Quotation</th>
                    <th>Customer</th>
                    <th>Item</th>
                    <th>Qty</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="q:${quotationsList}">
                    <td class="code-pill" th:text="${q.quotationCode}"></td>
                    <td th:text="${customerMap.get(q.customerId) != null ? customerMap.get(q.customerId).customerName : 'Unavailable'}"></td>
                    <td th:text="${(q.garmentType != null ? q.garmentType : '-') + ' / ' + (q.colour != null ? q.colour : '-') + ' / ' + (q.size != null ? q.size : '-')}"></td>
                    <td th:text="${q.quantity != null ? q.quantity : '-'}"></td>
                    <td th:text="${q.totalValue}"></td>
                    <td>
                        <span class="status-pill" th:text="${q.status}"></span>
                    </td>
                    <td>
                        <a class="customer-btn btn-edit" th:href="@{/customer/quotations(editId=${q.quotationId})}">Edit</a>
                        <form class="d-inline" th:if="${q.status == 'PENDING'}" method="post" th:action="@{/customer/quotations/approve/{id}(id=${q.quotationId})}">
                            <input type="number" name="approvedBy" placeholder="Approver ID" style="width:105px" class="form-control form-control-sm d-inline">
                            <button class="customer-btn btn-approve" type="submit">Approve</button>
                        </form>
                        <form class="d-inline" th:if="${q.status == 'PENDING'}" method="post" th:action="@{/customer/quotations/reject/{id}(id=${q.quotationId})}">
                            <input type="hidden" name="approvedBy" value="1">
                            <button class="customer-btn btn-reject" type="submit">Reject</button>
                        </form>
                        <a th:if="${q.status == 'APPROVED'}" class="customer-btn btn-main" th:href="@{/customer/orders(quotationId=${q.quotationId})}">Convert to Order</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
