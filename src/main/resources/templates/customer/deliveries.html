<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deliveries | LankaTex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common-navbar.css}">
    <link rel="stylesheet" th:href="@{/css/customer/customer-ui.css}">
</head>
<body class="customer-page">
<div th:replace="~{fragments/common-navbar :: navbar}"></div>
<main class="customer-shell">
    <section class="customer-hero">
        <span class="customer-eyebrow">Customer Relations</span>
        <h1>Deliveries</h1>
        <p class="mb-0">Record full or partial deliveries without exceeding the remaining approved order quantity.</p>
    </section>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <section class="customer-panel">
        <div class="customer-nav mb-3">
            <a th:href="@{/customer}">Dashboard</a>
            <a th:href="@{/customer/customers}">Customers</a>
            <a th:href="@{/customer/quotations}">Quotations</a>
            <a th:href="@{/customer/orders}">Orders</a>
        </div>
        <form th:action="@{/customer/deliveries/save}" th:object="${delivery}" method="post">
            <div class="form-section row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Ready Customer Order</label>
                    <select class="form-select" th:field="*{orderId}" required>
                        <option value="">Select READY order</option>
                        <option th:each="o:${deliverableOrders}" th:value="${o.orderId}" th:text="${o.orderCode + ' | ' + (customerMap.get(o.customerId) != null ? customerMap.get(o.customerId).customerName : 'Customer') + ' | Remaining: ' + (remainingQtyMap.get(o.orderId) != null ? remainingQtyMap.get(o.orderId) : '-')}"></option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Delivery Date</label>
                    <input type="date" class="form-control" th:field="*{deliveryDate}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Delivered Qty</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{deliveredQty}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Delivery Address</label>
                    <textarea class="form-control" rows="2" th:field="*{deliveryAddress}" placeholder="Leave blank to use customer delivery address"></textarea>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Receiver Name</label>
                    <input class="form-control" th:field="*{receiverName}">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Remarks</label>
                    <input class="form-control" th:field="*{remarks}">
                </div>
            </div>
            <button class="customer-btn btn-main" type="submit">Record Delivery</button>
        </form>
    </section>

    <section class="customer-panel">
        <div class="table-responsive">
            <table class="customer-table">
                <thead>
                <tr>
                    <th>Delivery</th>
                    <th>Order</th>
                    <th>Customer</th>
                    <th>Date</th>
                    <th>Qty</th>
                    <th>Status</th>
                    <th>Receiver</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="d:${deliveriesList}" th:with="o=${orderMap.get(d.orderId)}">
                    <td class="code-pill" th:text="${d.deliveryCode}"></td>
                    <td th:text="${o != null ? o.orderCode : 'Order unavailable'}"></td>
                    <td th:text="${o != null && customerMap.get(o.customerId) != null ? customerMap.get(o.customerId).customerName : 'Unavailable'}"></td>
                    <td th:text="${d.deliveryDate}"></td>
                    <td th:text="${d.deliveredQty}"></td>
                    <td>
                        <span class="status-pill" th:text="${d.status}"></span>
                    </td>
                    <td th:text="${d.receiverName != null ? d.receiverName : '-'}"></td>
                    <td>
                        <form th:if="${d.status != 'ARCHIVED'}" class="d-inline" method="post" th:action="@{/customer/deliveries/archive/{id}(id=${d.deliveryId})}">
                            <button class="customer-btn btn-reject" type="submit">Archive</button>
                        </form>
                        <form th:if="${d.status == 'ARCHIVED'}" class="d-inline" method="post" th:action="@{/customer/deliveries/restore/{id}(id=${d.deliveryId})}">
                            <button class="customer-btn btn-approve" type="submit">Restore</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(deliveriesList)}">
                    <td colspan="8" class="text-center text-muted py-3">No deliveries recorded yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
