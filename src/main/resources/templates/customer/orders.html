<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Order - Customer Order and Delivery Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Customer Order and Delivery Management</h2>
        <a class="btn btn-dark btn-sm" th:href="@{/customer}">Dashboard</a>
    </div>
    <div class="mb-3">
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/customer/customers}">Customer</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/customer/quotations}">Quotation</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/customer/orders}">Customer Order</a>
        <a class="btn btn-outline-primary btn-sm me-2 mb-2" th:href="@{/customer/deliverys}">Delivery</a>
    </div>
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>Validation Error: </strong><span th:text="${error}"></span>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header"><strong>Add / Edit Customer Order</strong></div>
        <div class="card-body">
            <form th:action="@{/customer/orders/save}" th:object="${customerOrder}" method="post">
                <input type="hidden" th:field="*{orderId}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Customer ID <span class="text-danger">*</span></label>
                        <input class="form-control" type="number" th:field="*{customerId}" min="1" placeholder="e.g. 1" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Quotation ID</label>
                        <input class="form-control" type="number" th:field="*{quotationId}" min="1" placeholder="Optional Quotation ID">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Order Date <span class="text-danger">*</span></label>
                        <input class="form-control" type="date" th:field="*{orderDate}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Required Delivery Date <span class="text-danger">*</span></label>
                        <input class="form-control" type="date" th:field="*{requiredDeliveryDate}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Priority <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{priority}" required>
                            <option value="">-- Select Priority --</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Urgent">Urgent</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select" th:field="*{status}">
                            <option value="Pending">Pending</option>
                            <option value="In Production">In Production</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                            <option value="Archived">Archived</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Approved By User ID</label>
                        <input class="form-control" type="number" th:field="*{approvedBy}" min="1" placeholder="User ID (optional)">
                    </div>
                </div>
                <button class="btn btn-success" type="submit">Save</button>
                <a class="btn btn-secondary" th:href="@{/customer/orders}">Clear</a>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header"><strong>Customer Order List</strong></div>
        <div class="card-body table-responsive">
            <table class="table table-striped table-bordered align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Customer ID</th>
                    <th>Quotation ID</th>
                    <th>Order Date</th>
                    <th>Required Delivery Date</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Approved By</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${ordersList}">
                    <td th:text="${row.orderId}"></td>
                    <td th:text="${row.customerId}"></td>
                    <td th:text="${row.quotationId}"></td>
                    <td th:text="${row.orderDate}"></td>
                    <td th:text="${row.requiredDeliveryDate}"></td>
                    <td>
                        <span class="badge" th:classappend="${row.priority == 'Urgent' ? 'bg-danger' : (row.priority == 'High' ? 'bg-warning text-dark' : (row.priority == 'Medium' ? 'bg-info text-dark' : 'bg-secondary'))}" th:text="${row.priority}"></span>
                    </td>
                    <td>
                        <span class="badge" th:classappend="${row.status == 'Completed' ? 'bg-success' : (row.status == 'Cancelled' ? 'bg-danger' : (row.status == 'Archived' ? 'bg-secondary' : 'bg-primary'))}" th:text="${row.status}"></span>
                    </td>
                    <td th:text="${row.approvedBy}"></td>
                    <td class="text-nowrap">
                        <a class="btn btn-warning btn-sm" th:href="@{/customer/orders(editId=${row.orderId})}">Edit</a>
                        <a class="btn btn-outline-danger btn-sm" th:href="@{/customer/orders/delete/{id}(id=${row.orderId})}" onclick="return confirm('Delete this order?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
