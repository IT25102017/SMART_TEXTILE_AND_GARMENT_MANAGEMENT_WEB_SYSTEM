<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Orders | LankaTex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common-navbar.css}">
    <link rel="stylesheet" th:href="@{/css/customer/customer-ui.css}">
</head>
<body class="customer-page">
<div th:replace="~{fragments/common-navbar :: navbar}"></div>
<main class="customer-shell">
    <section class="customer-hero">
        <span class="customer-eyebrow">Customer Relations</span>
        <h1>Customer Orders</h1>
        <p class="mb-0">Approve demand before production and track order progress until delivery.</p>
    </section>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <section class="customer-panel">
        <div class="customer-nav mb-3">
            <a th:href="@{/customer}">Dashboard</a>
            <a th:href="@{/customer/customers}">Customers</a>
            <a th:href="@{/customer/quotations}">Quotations</a>
            <a th:href="@{/customer/deliveries}">Deliveries</a>
        </div>
        <form th:action="@{/customer/orders/save}" th:object="${customerOrder}" method="post">
            <input type="hidden" th:field="*{orderId}">
            <input type="hidden" th:field="*{status}">
            <div class="form-section row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Customer</label>
                    <select class="form-select" th:field="*{customerId}" required>
                        <option value="">Select Customer</option>
                        <option th:each="c:${customers}" th:value="${c.customerId}" th:text="${c.customerCode + ' - ' + c.customerName}"></option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Approved Quotation (optional for direct order)</label>
                    <select class="form-select" th:field="*{quotationId}">
                        <option value="">Direct Order / No Quotation</option>
                        <option th:each="q:${approvedQuotations}" th:value="${q.quotationId}" th:text="${q.quotationCode + ' - ' + q.garmentType}"></option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Order Date</label>
                    <input type="date" class="form-control" th:field="*{orderDate}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Required Delivery Date</label>
                    <input type="date" class="form-control" th:field="*{requiredDeliveryDate}" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Priority</label>
                    <select class="form-select" th:field="*{priority}">
                        <option value="NORMAL">NORMAL</option>
                        <option value="HIGH">HIGH</option>
                        <option value="URGENT">URGENT</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Order Quantity</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{orderQty}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Garment Type</label>
                    <input class="form-control" th:field="*{garmentType}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Colour</label>
                    <input class="form-control" th:field="*{colour}">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Size</label>
                    <input class="form-control" th:field="*{size}">
                </div>
            </div>
            <button class="customer-btn btn-main" type="submit">Save Order</button>
            <a class="customer-btn btn-muted" th:href="@{/customer/orders}">Clear</a>
        </form>
    </section>

    <section class="customer-panel">
        <div class="table-responsive">
            <table class="customer-table">
                <thead>
                <tr>
                    <th>Order</th>
                    <th>Customer</th>
                    <th>Quotation</th>
                    <th>Qty</th>
                    <th>Remaining</th>
                    <th>Required Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o:${ordersList}">
                    <td class="code-pill" th:text="${o.orderCode}"></td>
                    <td th:text="${customerMap.get(o.customerId) != null ? customerMap.get(o.customerId).customerName : 'Unavailable'}"></td>
                    <td th:text="${o.quotationId != null && quotationMap.get(o.quotationId) != null ? quotationMap.get(o.quotationId).quotationCode : 'Direct Order'}"></td>
                    <td th:text="${o.orderQty != null ? o.orderQty : '-'}"></td>
                    <td th:text="${remainingQtyMap.get(o.orderId) != null ? remainingQtyMap.get(o.orderId) : '-'}"></td>
                    <td th:text="${o.requiredDeliveryDate}"></td>
                    <td>
                        <span class="status-pill" th:text="${o.status}"></span>
                    </td>
                    <td>
                        <a th:if="${o.status == 'PENDING'}" class="customer-btn btn-edit" th:href="@{/customer/orders(editId=${o.orderId})}">Edit</a>
                        <form th:if="${o.status == 'PENDING'}" class="d-inline" method="post" th:action="@{/customer/orders/approve/{id}(id=${o.orderId})}">
                            <input type="number" name="approvedBy" required placeholder="Approver ID" style="width:105px" class="form-control form-control-sm d-inline">
                            <button class="customer-btn btn-approve" type="submit">Approve</button>
                        </form>
                        <form th:if="${o.status == 'PENDING'}" class="d-inline" method="post" th:action="@{/customer/orders/reject/{id}(id=${o.orderId})}">
                            <input type="hidden" name="approvedBy" value="1">
                            <button class="customer-btn btn-reject" type="submit">Reject</button>
                        </form>
                        <form th:if="${o.status == 'APPROVED' || o.status == 'IN_PRODUCTION' || o.status == 'QUALITY_CHECKING'}" class="d-inline" method="post" th:action="@{/customer/orders/status/{id}(id=${o.orderId})}">
                            <select name="status" class="form-select form-select-sm d-inline" style="width:150px">
                                <option value="IN_PRODUCTION">IN_PRODUCTION</option>
                                <option value="QUALITY_CHECKING">QUALITY_CHECKING</option>
                                <option value="READY">READY</option>
                                <option value="CANCELLED">CANCELLED</option>
                            </select>
                            <button class="customer-btn btn-main" type="submit">Update</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
