<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Delivery Management - LankaTex
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container py-4">


    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Delivery Management
        </h2>

        <a class="btn btn-dark"
           th:href="@{/customer}">
            Back to Dashboard
        </a>

    </div>


    <!-- Customer Module Navigation -->
    <div class="mb-3">

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/customer/customers}">
            Customer
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/customer/quotations}">
            Quotation
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/customer/orders}">
            Customer Order
        </a>

        <a class="btn btn-primary btn-sm me-2 mb-2"
           th:href="@{/customer/deliverys}">
            Delivery
        </a>

    </div>


    <!-- Success Message -->
    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>


    <!-- Error Message -->
    <div th:if="${error}"
         class="alert alert-danger">

        <strong>
            Validation Error:
        </strong>

        <span th:text="${error}">
        </span>

    </div>


    <!-- Delivery Form -->
    <div class="card shadow-sm mb-4">

        <div class="card-header">

            <strong>
                Add / Edit Delivery
            </strong>

        </div>


        <div class="card-body">

            <form th:action="@{/customer/deliverys/save}"
                  th:object="${delivery}"
                  method="post">


                <input type="hidden"
                       th:field="*{deliveryId}">


                <div class="row">


                    <!-- Order ID -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Order ID
                            <span class="text-danger">*</span>
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{orderId}"
                               min="1"
                               placeholder="e.g. 1"
                               required>

                    </div>


                    <!-- Delivery Date -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Delivery Date
                            <span class="text-danger">*</span>
                        </label>

                        <input class="form-control"
                               type="date"
                               th:field="*{deliveryDate}"
                               required>

                    </div>


                    <!-- Delivery Address -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Delivery Address
                            <span class="text-danger">*</span>
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{deliveryAddress}"
                               minlength="5"
                               maxlength="1000"
                               placeholder="Full destination address"
                               required>

                    </div>


                    <!-- Delivered Quantity -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Delivered Quantity
                            <span class="text-danger">*</span>
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{deliveredQty}"
                               min="0.01"
                               step="0.01"
                               placeholder="e.g. 500.00"
                               required>

                    </div>


                    <!-- Receiver Name -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Receiver Name
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{receiverName}"
                               maxlength="100"
                               placeholder="e.g. Mr. Silva">

                    </div>


                    <!-- Status -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select class="form-select"
                                th:field="*{status}">

                            <option value="Pending">
                                Pending
                            </option>

                            <option value="In Transit">
                                In Transit
                            </option>

                            <option value="Delivered">
                                Delivered
                            </option>

                            <option value="Archived">
                                Archived
                            </option>

                        </select>

                    </div>


                    <!-- Remarks -->
                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Remarks
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{remarks}"
                               maxlength="1000"
                               placeholder="Remarks or delivery notes (optional)">

                    </div>


                </div>


                <button class="btn btn-success"
                        type="submit">
                    Save
                </button>


                <a class="btn btn-secondary"
                   th:href="@{/customer/deliverys}">
                    Clear
                </a>


            </form>

        </div>

    </div>


    <!-- Delivery List -->
    <div class="card shadow-sm">

        <div class="card-header">

            <strong>
                Delivery List
            </strong>

        </div>


        <div class="card-body table-responsive">

            <table class="table table-striped table-bordered align-middle">


                <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Order ID</th>
                    <th>Delivery Date</th>
                    <th>Delivery Address</th>
                    <th>Delivered Quantity</th>
                    <th>Receiver Name</th>
                    <th>Status</th>
                    <th>Remarks</th>
                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>


                <tr th:each="row : ${deliverysList}">


                    <td th:text="${row.deliveryId}">
                    </td>


                    <td th:text="${row.orderId}">
                    </td>


                    <td th:text="${row.deliveryDate}">
                    </td>


                    <td th:text="${row.deliveryAddress}">
                    </td>


                    <td th:text="${row.deliveredQty}">
                    </td>


                    <td th:text="${row.receiverName}">
                    </td>


                    <!-- Status -->
                    <td>

                        <span class="badge"
                              th:classappend="${
                                  row.status == 'Delivered'
                                  ? 'bg-success'
                                  : (
                                      row.status == 'In Transit'
                                      ? 'bg-info text-dark'
                                      : (
                                          row.status == 'Archived'
                                          ? 'bg-secondary'
                                          : 'bg-warning text-dark'
                                      )
                                  )
                              }"
                              th:text="${row.status}">
                        </span>

                    </td>


                    <td th:text="${row.remarks}">
                    </td>


                    <!-- Actions -->
                    <td class="text-nowrap">


                        <!-- Edit -->
                        <a class="btn btn-warning btn-sm"
                           th:href="@{/customer/deliverys(editId=${row.deliveryId})}">
                            Edit
                        </a>


                        <!-- Delete -->
                        <a class="btn btn-danger btn-sm"
                           th:href="@{/customer/deliverys/delete/{id}(id=${row.deliveryId})}"
                           onclick="return confirm('Delete this delivery?');">
                            Delete
                        </a>


                    </td>


                </tr>


                </tbody>


            </table>

        </div>

    </div>


</div>


</body>

</html>
