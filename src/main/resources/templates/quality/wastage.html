<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Wastage Records</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Quality Control Management</h2>

        <a class="btn btn-dark btn-sm"
           th:href="@{/quality}">
            Dashboard
        </a>
    </div>


    <div class="mb-3">
        <a class="btn btn-outline-primary btn-sm me-2"
           th:href="@{/quality/inspections}">
            Inspections
        </a>

        <a class="btn btn-outline-primary btn-sm me-2"
           th:href="@{/quality/defects}">
            Defects
        </a>

        <a class="btn btn-outline-primary btn-sm me-2"
           th:href="@{/quality/wastage}">
            Wastage
        </a>

        <a class="btn btn-outline-primary btn-sm"
           th:href="@{/quality/holds}">
            Quality Holds
        </a>
    </div>


    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <div class="card shadow-sm mb-4">

        <div class="card-header">
            <strong>Add / Edit Wastage Record</strong>
        </div>

        <div class="card-body">

            <form th:action="@{/quality/wastage/save}"
                  th:object="${wastageRecord}"
                  method="post">

                <input type="hidden"
                       th:field="*{wastageId}">


                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Production Plan ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{planId}">
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Material ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{materialId}">
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Quantity
                        </label>

                        <input class="form-control"
                               type="number"
                               step="0.01"
                               th:field="*{quantity}"
                               required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Unit
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{unit}"
                               required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Reason
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{reason}"
                               required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Approval Status
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{approvalStatus}">
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Recorded By User ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{recordedBy}">
                    </div>

                </div>


                <button class="btn btn-success"
                        type="submit">
                    Save
                </button>

                <a class="btn btn-secondary"
                   th:href="@{/quality/wastage}">
                    Clear
                </a>

            </form>

        </div>
    </div>


    <div class="card shadow-sm">

        <div class="card-header">
            <strong>Wastage Record List</strong>
        </div>

        <div class="card-body table-responsive">

            <table class="table table-striped table-bordered align-middle">

                <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Plan ID</th>
                    <th>Material ID</th>
                    <th>Quantity</th>
                    <th>Unit</th>
                    <th>Reason</th>
                    <th>Approval Status</th>
                    <th>Recorded By</th>
                    <th>Actions</th>
                </tr>

                </thead>


                <tbody>

                <tr th:each="row : ${wastageList}">

                    <td th:text="${row.wastageId}"></td>
                    <td th:text="${row.planId}"></td>
                    <td th:text="${row.materialId}"></td>
                    <td th:text="${row.quantity}"></td>
                    <td th:text="${row.unit}"></td>
                    <td th:text="${row.reason}"></td>
                    <td th:text="${row.approvalStatus}"></td>
                    <td th:text="${row.recordedBy}"></td>


                    <td class="text-nowrap">

                        <a class="btn btn-warning btn-sm"
                           th:href="@{/quality/wastage(editId=${row.wastageId})}">
                            Edit
                        </a>

                        <a class="btn btn-outline-secondary btn-sm"
                           th:href="@{/quality/wastage/archive/{id}(id=${row.wastageId})}"
                           onclick="return confirm('Archive this Wastage Record?')">
                            Archive
                        </a>

                        <a class="btn btn-danger btn-sm"
                           th:href="@{/quality/wastage/delete/{id}(id=${row.wastageId})}"
                           onclick="return confirm('WARNING: Permanently delete this Wastage Record?')">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
