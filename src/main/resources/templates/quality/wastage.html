<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Wastage Record Management - LankaTex
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container py-4">


    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Wastage Record Management
        </h2>

        <a class="btn btn-dark"
           th:href="@{/quality}">
            Back to Dashboard
        </a>

    </div>


    <!-- Quality Module Navigation -->
    <div class="mb-3">

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/quality/inspections}">
            Quality Inspection
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/quality/defects}">
            Defect Record
        </a>

        <a class="btn btn-primary btn-sm me-2 mb-2"
           th:href="@{/quality/wastage}">
            Wastage Record
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/quality/holds}">
            Quality Hold
        </a>

    </div>


    <!-- Success Message -->
    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>


    <!-- Error Message -->
    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <!-- Wastage Record Form -->
    <div class="card shadow-sm mb-4">

        <div class="card-header">

            <strong>
                Add / Edit Wastage Record
            </strong>

        </div>


        <div class="card-body">

            <form th:action="@{/quality/wastage/save}"
                  th:object="${wastageRecord}"
                  method="post">


                <input type="hidden"
                       th:field="*{wastageId}">


                <div class="row">


                    <!-- Production Plan ID -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Production Plan ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{planId}">

                    </div>


                    <!-- Material ID -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Material ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{materialId}">

                    </div>


                    <!-- Quantity -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Quantity
                        </label>

                        <input class="form-control"
                               type="number"
                               step="0.01"
                               th:field="*{quantity}"
                               required>

                    </div>


                    <!-- Unit -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Unit
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{unit}"
                               required>

                    </div>


                    <!-- Reason -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Reason
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{reason}"
                               required>

                    </div>


                    <!-- Approval Status -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Approval Status
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{approvalStatus}">

                    </div>


                    <!-- Recorded By -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Recorded By User ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{recordedBy}">

                    </div>


                </div>


                <button class="btn btn-success"
                        type="submit">
                    Save
                </button>


                <a class="btn btn-secondary"
                   th:href="@{/quality/wastage}">
                    Clear
                </a>


            </form>

        </div>

    </div>


    <!-- Wastage Record List -->
    <div class="card shadow-sm">

        <div class="card-header">

            <strong>
                Wastage Record List
            </strong>

        </div>


        <div class="card-body table-responsive">

            <table class="table table-striped table-bordered align-middle">


                <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Plan ID</th>
                    <th>Material ID</th>
                    <th>Quantity</th>
                    <th>Unit</th>
                    <th>Reason</th>
                    <th>Approval Status</th>
                    <th>Recorded By</th>
                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>


                <tr th:each="row : ${wastageList}">


                    <td th:text="${row.wastageId}">
                    </td>


                    <td th:text="${row.planId}">
                    </td>


                    <td th:text="${row.materialId}">
                    </td>


                    <td th:text="${row.quantity}">
                    </td>


                    <td th:text="${row.unit}">
                    </td>


                    <td th:text="${row.reason}">
                    </td>


                    <td th:text="${row.approvalStatus}">
                    </td>


                    <td th:text="${row.recordedBy}">
                    </td>


                    <!-- Actions -->
                    <td class="text-nowrap">


                        <!-- Edit -->
                        <a class="btn btn-warning btn-sm"
                           th:href="@{/quality/wastage(editId=${row.wastageId})}">
                            Edit
                        </a>


                        <!-- Archive -->
                        <a class="btn btn-outline-secondary btn-sm"
                           th:href="@{/quality/wastage/archive/{id}(id=${row.wastageId})}"
                           onclick="return confirm('Archive this Wastage Record?');">
                            Archive
                        </a>


                        <!-- Delete -->
                        <a class="btn btn-danger btn-sm"
                           th:href="@{/quality/wastage/delete/{id}(id=${row.wastageId})}"
                           onclick="return confirm('WARNING: Permanently delete this Wastage Record?');">
                            Delete
                        </a>


                    </td>


                </tr>


                </tbody>


            </table>

        </div>

    </div>


</div>


</body>

</html>
