<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Quality Inspections</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Quality Control Management</h2>

        <a class="btn btn-dark btn-sm"
           th:href="@{/quality}">
            Dashboard
        </a>
    </div>


    <div class="mb-3">
        <a class="btn btn-outline-primary btn-sm me-2"
           th:href="@{/quality/inspections}">
            Inspections
        </a>

        <a class="btn btn-outline-primary btn-sm me-2"
           th:href="@{/quality/defects}">
            Defects
        </a>

        <a class="btn btn-outline-primary btn-sm me-2"
           th:href="@{/quality/wastage}">
            Wastage
        </a>

        <a class="btn btn-outline-primary btn-sm"
           th:href="@{/quality/holds}">
            Quality Holds
        </a>
    </div>


    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <div class="card shadow-sm mb-4">

        <div class="card-header">
            <strong>Add / Edit Quality Inspection</strong>
        </div>

        <div class="card-body">

            <form th:action="@{/quality/inspections/save}"
                  th:object="${qualityInspection}"
                  method="post">

                <input type="hidden"
                       th:field="*{inspectionId}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Production Plan ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{planId}"
                               required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Customer Order ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{orderId}">
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Stage Name
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{stageName}"
                               required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Inspection Date
                        </label>

                        <input class="form-control"
                               type="date"
                               th:field="*{inspectionDate}"
                               required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Inspector ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{inspectorId}">
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Status
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{status}">
                    </div>

                </div>


                <button class="btn btn-success"
                        type="submit">
                    Save
                </button>

                <a class="btn btn-secondary"
                   th:href="@{/quality/inspections}">
                    Clear
                </a>

            </form>
        </div>
    </div>


    <div class="card shadow-sm">

        <div class="card-header">
            <strong>Quality Inspection List</strong>
        </div>

        <div class="card-body table-responsive">

            <table class="table table-striped table-bordered align-middle">

                <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Plan ID</th>
                    <th>Order ID</th>
                    <th>Stage</th>
                    <th>Date</th>
                    <th>Inspector ID</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="row : ${inspectionsList}">

                    <td th:text="${row.inspectionId}"></td>
                    <td th:text="${row.planId}"></td>
                    <td th:text="${row.orderId}"></td>
                    <td th:text="${row.stageName}"></td>
                    <td th:text="${row.inspectionDate}"></td>
                    <td th:text="${row.inspectorId}"></td>
                    <td th:text="${row.status}"></td>

                    <td class="text-nowrap">

                        <a class="btn btn-warning btn-sm"
                           th:href="@{/quality/inspections(editId=${row.inspectionId})}">
                            Edit
                        </a>

                        <a class="btn btn-outline-secondary btn-sm"
                           th:href="@{/quality/inspections/archive/{id}(id=${row.inspectionId})}"
                           onclick="return confirm('Archive this Quality Inspection?')">
                            Archive
                        </a>

                        <a class="btn btn-danger btn-sm"
                           th:href="@{/quality/inspections/delete/{id}(id=${row.inspectionId})}"
                           onclick="return confirm('WARNING: Permanently delete this Quality Inspection?')">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
