<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Quality Holds</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>Quality Control Management</h2>

        <a class="btn btn-dark btn-sm"
           th:href="@{/quality}">
            Dashboard
        </a>

    </div>


    <div class="mb-3">

        <a class="btn btn-outline-primary btn-sm me-2"
           th:href="@{/quality/inspections}">
            Inspections
        </a>

        <a class="btn btn-outline-primary btn-sm me-2"
           th:href="@{/quality/defects}">
            Defects
        </a>

        <a class="btn btn-outline-primary btn-sm me-2"
           th:href="@{/quality/wastage}">
            Wastage
        </a>

        <a class="btn btn-outline-primary btn-sm"
           th:href="@{/quality/holds}">
            Quality Holds
        </a>

    </div>


    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <div class="card shadow-sm mb-4">

        <div class="card-header">
            <strong>Add / Edit Quality Hold</strong>
        </div>

        <div class="card-body">

            <form th:action="@{/quality/holds/save}"
                  th:object="${qualityHold}"
                  method="post">

                <input type="hidden"
                       th:field="*{holdId}">


                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Production Plan ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{planId}">
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Customer Order ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{orderId}">
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Inspection ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{inspectionId}"
                               required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Reason
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{reason}"
                               required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Status
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{status}">
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Released By User ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{releasedBy}">
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Released At
                        </label>

                        <input class="form-control"
                               type="datetime-local"
                               th:field="*{releasedAt}">
                    </div>

                </div>


                <button class="btn btn-success"
                        type="submit">
                    Save
                </button>

                <a class="btn btn-secondary"
                   th:href="@{/quality/holds}">
                    Clear
                </a>

            </form>

        </div>
    </div>


    <div class="card shadow-sm">

        <div class="card-header">
            <strong>Quality Hold List</strong>
        </div>

        <div class="card-body table-responsive">

            <table class="table table-striped table-bordered align-middle">

                <thead class="table-dark">

                <tr>
                    <th>ID</th>
                    <th>Plan ID</th>
                    <th>Order ID</th>
                    <th>Inspection ID</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Released By</th>
                    <th>Released At</th>
                    <th>Actions</th>
                </tr>

                </thead>


                <tbody>

                <tr th:each="row : ${holdsList}">

                    <td th:text="${row.holdId}"></td>
                    <td th:text="${row.planId}"></td>
                    <td th:text="${row.orderId}"></td>
                    <td th:text="${row.inspectionId}"></td>
                    <td th:text="${row.reason}"></td>
                    <td th:text="${row.status}"></td>
                    <td th:text="${row.releasedBy}"></td>
                    <td th:text="${row.releasedAt}"></td>


                    <td class="text-nowrap">

                        <a class="btn btn-warning btn-sm"
                           th:href="@{/quality/holds(editId=${row.holdId})}">
                            Edit
                        </a>

                        <a class="btn btn-outline-secondary btn-sm"
                           th:href="@{/quality/holds/archive/{id}(id=${row.holdId})}"
                           onclick="return confirm('Archive this Quality Hold?')">
                            Archive
                        </a>

                        <a class="btn btn-danger btn-sm"
                           th:href="@{/quality/holds/delete/{id}(id=${row.holdId})}"
                           onclick="return confirm('WARNING: Permanently delete this Quality Hold?')">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
