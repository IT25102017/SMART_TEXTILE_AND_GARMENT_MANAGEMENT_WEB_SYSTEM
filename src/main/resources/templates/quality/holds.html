<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Quality Hold Management - LankaTex
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common LankaTex Navigation CSS -->
    <link rel="stylesheet"
          th:href="@{/css/common-navbar.css}">

</head>


<body class="bg-light">


<!-- Common LankaTex Navigation Bar -->
<div th:replace="~{fragments/common-navbar :: navbar}"></div>


<div class="container py-4">


    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Quality Hold Management
        </h2>

        <a class="btn btn-dark"
           th:href="@{/quality}">
            Back to Dashboard
        </a>

    </div>


    <!-- Quality Module Navigation -->
    <div class="mb-3">

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/quality/inspections}">
            Quality Inspection
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/quality/defects}">
            Defect Record
        </a>

        <a class="btn btn-outline-primary btn-sm me-2 mb-2"
           th:href="@{/quality/wastage}">
            Wastage Record
        </a>

        <a class="btn btn-primary btn-sm me-2 mb-2"
           th:href="@{/quality/holds}">
            Quality Hold
        </a>

    </div>


    <!-- Success Message -->
    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>


    <!-- Error Message -->
    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>


    <!-- Quality Hold Form -->
    <div class="card shadow-sm mb-4">

        <div class="card-header">

            <strong>
                Add / Edit Quality Hold
            </strong>

        </div>


        <div class="card-body">

            <form th:action="@{/quality/holds/save}"
                  th:object="${qualityHold}"
                  method="post">


                <input type="hidden"
                       th:field="*{holdId}">


                <div class="row">


                    <!-- Production Plan ID -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Production Plan ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{planId}">

                    </div>


                    <!-- Customer Order ID -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Customer Order ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{orderId}">

                    </div>


                    <!-- Inspection ID -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Inspection ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{inspectionId}"
                               required>

                    </div>


                    <!-- Reason -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Reason
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{reason}"
                               required>

                    </div>


                    <!-- Status -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <input class="form-control"
                               type="text"
                               th:field="*{status}">

                    </div>


                    <!-- Released By -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Released By User ID
                        </label>

                        <input class="form-control"
                               type="number"
                               th:field="*{releasedBy}">

                    </div>


                    <!-- Released At -->
                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Released At
                        </label>

                        <input class="form-control"
                               type="datetime-local"
                               th:field="*{releasedAt}">

                    </div>


                </div>


                <button class="btn btn-success"
                        type="submit">
                    Save
                </button>


                <a class="btn btn-secondary"
                   th:href="@{/quality/holds}">
                    Clear
                </a>


            </form>

        </div>

    </div>


    <!-- Quality Hold List -->
    <div class="card shadow-sm">

        <div class="card-header">

            <strong>
                Quality Hold List
            </strong>

        </div>


        <div class="card-body table-responsive">

            <table class="table table-striped table-bordered align-middle">


                <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Plan ID</th>
                    <th>Order ID</th>
                    <th>Inspection ID</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Released By</th>
                    <th>Released At</th>
                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>


                <tr th:each="row : ${holdsList}">


                    <td th:text="${row.holdId}">
                    </td>

                    <td th:text="${row.planId}">
                    </td>

                    <td th:text="${row.orderId}">
                    </td>

                    <td th:text="${row.inspectionId}">
                    </td>

                    <td th:text="${row.reason}">
                    </td>


                    <!-- Status -->
                    <td>

                        <span th:if="${row.status == 'Pending'}"
                              class="badge bg-warning text-dark">
                            Pending
                        </span>

                        <span th:if="${row.status == 'Archived'}"
                              class="badge bg-secondary">
                            Archived
                        </span>

                        <span th:if="${row.status != 'Pending'
                                      and row.status != 'Archived'}"
                              class="badge bg-info text-dark"
                              th:text="${row.status}">
                        </span>

                    </td>


                    <td th:text="${row.releasedBy}">
                    </td>

                    <td th:text="${row.releasedAt}">
                    </td>


                    <!-- Actions -->
                    <td class="text-nowrap">


                        <!-- Edit -->
                        <a class="btn btn-warning btn-sm"
                           th:href="@{/quality/holds(editId=${row.holdId})}">
                            Edit
                        </a>


                        <!-- Archive -->
                        <a th:if="${row.status != 'Archived'}"
                           class="btn btn-secondary btn-sm"
                           th:href="@{/quality/holds/archive/{id}(id=${row.holdId})}"
                           onclick="return confirm('Archive this Quality Hold?');">
                            Archive
                        </a>


                        <!-- Restore -->
                        <a th:if="${row.status == 'Archived'}"
                           class="btn btn-success btn-sm"
                           th:href="@{/quality/holds/restore/{id}(id=${row.holdId})}"
                           onclick="return confirm('Restore this Quality Hold back to Pending status?');">
                            Restore
                        </a>


                        <!-- Permanent Delete -->
                        <a class="btn btn-danger btn-sm"
                           th:href="@{/quality/holds/delete/{id}(id=${row.holdId})}"
                           onclick="return confirm('WARNING: Permanently delete this Quality Hold?');">
                            Delete
                        </a>


                    </td>


                </tr>


                </tbody>

            </table>

        </div>

    </div>


</div>


</body>

</html>
