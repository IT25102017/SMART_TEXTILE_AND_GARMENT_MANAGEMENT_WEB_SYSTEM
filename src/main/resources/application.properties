# =========================================
# APPLICATION NAME
# =========================================

spring.application.name=smart-textile-management


# =========================================
# SQL SERVER DATABASE CONNECTION
# =========================================

# Local SQL Server connection
# Database: LankaTexDB
# Port: 1433
#
# Windows Integrated Authentication is intentionally not used here.
# SQL Server Authentication is easier to use across different team laptops.

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LankaTexDB;encrypt=true;trustServerCertificate=true}

# SQL Server Authentication credentials
#
# Replace YOUR_SQL_USERNAME and YOUR_SQL_PASSWORD
# with the SQL Server login configured on this laptop.
#
# Example:
# DB username = sa
# DB password = your SQL Server password

spring.datasource.username=lankatex_app

spring.datasource.password=LankaTex@2026

# Microsoft SQL Server JDBC Driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# =========================================
# JPA / HIBERNATE SETTINGS
# =========================================

# Automatically create/update tables from Entity classes
spring.jpa.hibernate.ddl-auto=update

# Explicit SQL Server dialect
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Show SQL queries in IntelliJ console
spring.jpa.show-sql=true

# Make SQL queries easier to read
spring.jpa.properties.hibernate.format_sql=true

# Prevent database queries during HTML rendering
spring.jpa.open-in-view=false

# Do not apply Bean Validation (@NotNull) to schema DDL generation for non-empty tables
spring.jpa.properties.hibernate.validator.apply_to_ddl=false


# =========================================
# THYMELEAF SETTINGS
# =========================================

# Disable cache while developing so HTML changes appear immediately
spring.thymeleaf.cache=false


# =========================================
# TEMPORARY DEVELOPMENT LOGIN
# =========================================

# Application login username
spring.security.user.name=admin

# Application login password
spring.security.user.password=admin123