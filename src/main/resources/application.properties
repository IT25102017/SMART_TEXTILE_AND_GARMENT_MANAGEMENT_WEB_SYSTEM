# =========================================
# APPLICATION NAME
# =========================================
spring.application.name=smart-textile-management


# =========================================
# SQL SERVER DATABASE CONNECTION
# =========================================

# Local SQL Server connection
# Database: LankaTexDB
# Port: 1433
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LankaTexDB;encrypt=true;trustServerCertificate=true;integratedSecurity=true}

# Microsoft SQL Server JDBC Driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# =========================================
# JPA / HIBERNATE SETTINGS
# =========================================

# Automatically create/update tables from Entity classes
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in IntelliJ console
spring.jpa.show-sql=true

# Make SQL queries easier to read
spring.jpa.properties.hibernate.format_sql=true

# Prevent database queries during HTML rendering
spring.jpa.open-in-view=false


# =========================================
# THYMELEAF SETTINGS
# =========================================

# Disable cache while developing so HTML changes appear immediately
spring.thymeleaf.cache=false


# =========================================
# TEMPORARY DEVELOPMENT LOGIN
# =========================================

# Fixed username
spring.security.user.name=admin

# Fixed password
spring.security.user.password=admin123